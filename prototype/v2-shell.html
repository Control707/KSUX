<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · KSUX v2 shell &amp; design system</title>
<!--
  THROWAWAY PROTOTYPE. Lives on branch prototype/v2-shell, never merged.
  Ticket: "Prototype redesigned shell and design system (visual directions)" (Map: KSUX v2).
  Plan: three structurally different directions for the 5-slot shell + Quick Sheet + sticky header/Campus switcher
  + a Now HUD card set + desktop >=1024px, switchable via ?variant=A|B|C and the floating bar.
  Standalone HTML (same as prototype/ksux-shell) because the whole shell is the thing under question.
  Run: open this file in a browser. No build, no data, no persistence: state lives in memory + URL.
  Floating bar keys: <- / -> cycle variants (ignored while a form field is focused).
-->
<style>
*,*::before,*::after{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:#26282d;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.stage{height:calc(100dvh - 72px);display:flex;align-items:center;justify-content:center;padding:12px}
.stage[data-frame="fluid"]{padding:0}
.stage[data-frame="fluid"] .app{width:100%;height:100%}
.stage[data-frame="phone"] .app{width:390px;height:min(844px,100%);border-radius:30px;box-shadow:0 0 0 10px #0d0e10,0 24px 60px rgba(0,0,0,.55)}

/* ================= TOKENS ================= */
.app{
  --fs-xs:.8125rem; --fs-sm:.875rem; --fs-body:1rem; --fs-lg:1.125rem; --fs-xl:1.375rem; --fs-2xl:1.75rem; --fs-3xl:2.25rem;
  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem; --sp-5:1.5rem; --sp-6:2rem;
  --target:2.75rem; --target-min:1.5rem;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --font-display:var(--font-body); --font-num:var(--font-body);
  --dur-1:120ms; --dur-2:240ms; --dur-fade:150ms; --ease:cubic-bezier(.2,.8,.2,1); --sheet-move:100%;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --focus-w:3px; --focus-header:var(--focus);
}
.app[data-motion="reduce"]{--dur-1:0ms;--dur-2:0ms;--sheet-move:0%}
@media (prefers-reduced-motion:reduce){.app[data-motion="system"]{--dur-1:0ms;--dur-2:0ms;--sheet-move:0%}}

/* A · Gold Bento */
.app[data-variant="A"]{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#EDEFF3; --ink:#14171C; --muted:#515866; --line:#D6DAE1;
  --accent:#FDBB30; --on-accent:#14171C; --accent-ink:#7A5300; --accent-soft:#FFF4D6;
  --header:#14171C; --on-header:#FFFFFF; --header-muted:#B9BFCA; --demo:#FFB020; --demo-ink:#1A1200;
  --focus:#0B57D0; --focus-header:#8AB4F8;
  --open-fg:#00517F; --open-bg:#E2F0F9; --filling-fg:#6B4700; --filling-bg:#FCEFD2; --full-fg:#9A3A00; --full-bg:#FBE4D6;
  --open-mark:#0072B2; --filling-mark:#B07A00; --full-mark:#D55E00;
  --r-card:20px; --rail-w:15rem;
}
.app[data-variant="A"][data-theme="dark"]{
  --bg:#0F1115; --surface:#181B21; --surface-2:#22262E; --ink:#F2F3F5; --muted:#A9B0BC; --line:#333944;
  --accent:#FDBB30; --on-accent:#14171C; --accent-ink:#FDBB30; --accent-soft:#2B2410;
  --header:#0A0B0E; --on-header:#FFFFFF; --header-muted:#A9B0BC; --demo:#FFB020; --demo-ink:#1A1200;
  --focus:#8AB4F8;
  --open-fg:#8CCBF2; --open-bg:#0F2A3D; --filling-fg:#F6C667; --filling-bg:#34270C; --full-fg:#FFA27A; --full-bg:#3D1D0F;
  --open-mark:#56B4E9; --filling-mark:#E69F00; --full-mark:#FF7A33;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
/* B · Night Owl Board */
.app[data-variant="B"]{
  --bg:#FFFFFF; --surface:#F6F7F8; --surface-2:#ECEEF1; --ink:#0A0B0D; --muted:#4B5260; --line:#D9DCE1;
  --accent:#FFC629; --on-accent:#0A0B0D; --accent-ink:#6B4E00; --accent-soft:#FFF5D1;
  --header:#FFFFFF; --on-header:#0A0B0D; --header-muted:#4B5260; --demo:#FFB020; --demo-ink:#1A1200;
  --focus:#0B57D0;
  --open-fg:#00517F; --open-bg:#E2F0F9; --filling-fg:#6B4700; --filling-bg:#FCEFD2; --full-fg:#9A3A00; --full-bg:#FBE4D6;
  --open-mark:#0072B2; --filling-mark:#B07A00; --full-mark:#D55E00;
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-card:8px; --rail-w:4.5rem;
  --font-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --dur-2:160ms; --shadow:none;
}
.app[data-variant="B"][data-theme="dark"]{
  --bg:#0A0B0D; --surface:#121418; --surface-2:#1B1E24; --ink:#ECEEF1; --muted:#9CA3AF; --line:#2A2F38;
  --accent:#FFC629; --on-accent:#0A0B0D; --accent-ink:#FFC629; --accent-soft:#2A230B;
  --header:#0A0B0D; --on-header:#ECEEF1; --header-muted:#9CA3AF; --demo:#FFB020; --demo-ink:#1A1200;
  --focus:#7FB2FF;
  --open-fg:#8CCBF2; --open-bg:#0F2A3D; --filling-fg:#F6C667; --filling-bg:#34270C; --full-fg:#FFA27A; --full-bg:#3D1D0F;
  --open-mark:#56B4E9; --filling-mark:#E69F00; --full-mark:#FF7A33;
}
/* C · Campus Brief */
.app[data-variant="C"]{
  --bg:#FBF7EF; --surface:#FFFFFF; --surface-2:#F3ECDD; --ink:#1F1A14; --muted:#5C5245; --line:#E2D8C6;
  --accent:#FDBB30; --on-accent:#1F1A14; --accent-ink:#7A4E00; --accent-soft:#FBEBC4;
  --header:#FBF7EF; --on-header:#1F1A14; --header-muted:#5C5245; --demo:#FFB020; --demo-ink:#1A1200;
  --focus:#0B57D0;
  --open-fg:#00517F; --open-bg:#E2F0F9; --filling-fg:#6B4700; --filling-bg:#FCEFD2; --full-fg:#9A3A00; --full-bg:#FBE4D6;
  --open-mark:#0072B2; --filling-mark:#B07A00; --full-mark:#D55E00;
  --fs-body:1.0625rem; --r-sm:12px; --r-md:18px; --r-lg:24px; --r-card:28px; --rail-w:16rem;
  --font-display:ui-serif,"Iowan Old Style","Charter",Georgia,serif;
  --dur-2:320ms; --shadow:0 2px 6px rgba(60,40,10,.06),0 12px 32px rgba(60,40,10,.08);
}
.app[data-variant="C"][data-theme="dark"]{
  --bg:#17140F; --surface:#211D17; --surface-2:#2C271F; --ink:#F6EFE3; --muted:#BFB3A0; --line:#3A342A;
  --accent:#FDBB30; --on-accent:#1F1A14; --accent-ink:#FDCB5C; --accent-soft:#3A2F14;
  --header:#17140F; --on-header:#F6EFE3; --header-muted:#BFB3A0; --demo:#FFB020; --demo-ink:#1A1200;
  --focus:#8AB4F8;
  --open-fg:#8CCBF2; --open-bg:#0F2A3D; --filling-fg:#F6C667; --filling-bg:#34270C; --full-fg:#FFA27A; --full-bg:#3D1D0F;
  --open-mark:#56B4E9; --filling-mark:#E69F00; --full-mark:#FF7A33;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

/* ================= SHARED PRIMITIVES ================= */
.app{position:relative;overflow:hidden;container:app/inline-size;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:var(--fs-body);line-height:1.5;color-scheme:light}
.app[data-theme="dark"]{color-scheme:dark}
#shellRoot{height:100%}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.app :focus-visible{outline:var(--focus-w) solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.skip{position:absolute;left:var(--sp-2);top:-4rem;z-index:50;background:var(--ink);color:var(--bg);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-sm);font-weight:700}
.skip:focus{top:var(--sp-2)}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.meta{font-size:var(--fs-xs);color:var(--muted)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
.btn{min-height:var(--target);padding:0 var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);text-decoration:none;font-size:var(--fs-sm)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn-link{min-height:var(--target);display:inline-flex;align-items:center;gap:var(--sp-1);color:var(--accent-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;font-size:var(--fs-sm)}
.icon-btn{min-width:var(--target);min-height:var(--target);display:grid;place-items:center;border:0;background:var(--surface-2);border-radius:var(--r-pill);cursor:pointer;color:var(--ink)}
svg.i{flex:none;display:block}

/* status: icon shape + text + pattern; colour is only the 4th cue */
.chip{display:inline-flex;align-items:center;gap:.3em;font-size:var(--fs-xs);font-weight:700;padding:.15rem .55rem .15rem .4rem;border-radius:var(--r-pill);white-space:nowrap}
.chip.open{color:var(--open-fg);background:var(--open-bg)}
.chip.filling{color:var(--filling-fg);background:var(--filling-bg)}
.chip.full{color:var(--full-fg);background:var(--full-bg)}
.bar{height:.5rem;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;flex:1}
.fill{display:block;height:100%;border-radius:inherit}
.fill.open{background:var(--open-mark)}
.fill.filling{background:repeating-linear-gradient(90deg,var(--filling-mark) 0 7px,transparent 7px 9px)}
.fill.full{background:repeating-linear-gradient(135deg,var(--full-mark) 0 5px,color-mix(in srgb,var(--full-mark) 55%,transparent) 5px 8px)}
.mark.open{color:var(--open-mark)} .mark.filling{color:var(--filling-mark)} .mark.full{color:var(--full-mark)}

.badge{position:absolute;top:.2rem;left:calc(50% + .45rem);min-width:1.25rem;height:1.25rem;padding:0 .3rem;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:800;display:grid;place-items:center;line-height:1}

/* demo pill + menu */
.demo{position:relative}
.demo-pill{min-height:var(--target);display:inline-flex;align-items:center;gap:.3rem;padding:0 var(--sp-3);border-radius:var(--r-pill);border:0;background:var(--demo);color:var(--demo-ink);font-weight:800;font-size:var(--fs-xs);cursor:pointer;white-space:nowrap}
.demo-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:min(17rem,80vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2);box-shadow:0 12px 32px rgba(0,0,0,.25)}
.demo-menu hr{border:0;border-top:1px solid var(--line);margin:var(--sp-2) 0}
.demo-h{font-size:var(--fs-xs);font-weight:800;color:var(--muted);padding:var(--sp-1) var(--sp-2);text-transform:uppercase;letter-spacing:.06em}
.menu-item{display:flex;flex-direction:column;align-items:flex-start;width:100%;min-height:var(--target);padding:var(--sp-2);border:0;background:none;border-radius:var(--r-sm);cursor:pointer;text-align:left;font-size:var(--fs-sm);font-weight:650}
.menu-item:hover{background:var(--surface-2)}
.menu-item[aria-pressed="true"]::after{content:"Active";font-size:var(--fs-xs);color:var(--accent-ink);font-weight:800}
.menu-item .muted{font-weight:500;font-size:var(--fs-xs)}

/* shell grid */
.shell{display:grid;height:100%;min-height:0;grid-template-rows:auto 1fr auto;grid-template-columns:100%;grid-template-areas:"header" "main" "nav"}
.hdr{grid-area:header;position:relative;z-index:5}
.main{grid-area:main;overflow:auto;min-height:0;overscroll-behavior:contain;scroll-padding-block:var(--sp-6)}
.nav{grid-area:nav;position:relative;z-index:5}
.rail,.pulse{display:none}
@container app (min-width:1024px){
  .shell{grid-template-columns:var(--rail-w) minmax(0,1fr) 21rem;grid-template-rows:auto 1fr;grid-template-areas:"rail header header" "rail main pulse"}
  .nav{display:none!important}
  .rail{display:flex;flex-direction:column;grid-area:rail;min-height:0;overflow:auto}
  .pulse{display:block;grid-area:pulse;overflow:auto;min-height:0}
}
.rail a,.rail button{min-height:var(--target)}

.now{grid-template-columns:minmax(0,1fr)}
.carousel .chip{justify-self:start}
/* placeholder screens */
.ph{padding:var(--sp-5) var(--sp-4);display:grid;gap:var(--sp-4);max-width:46rem;margin:0 auto}
.ph h1{font-family:var(--font-display);font-size:var(--fs-2xl);line-height:1.2}
.ph .note{padding:var(--sp-3) var(--sp-4);border:1px dashed var(--line);border-radius:var(--r-md);color:var(--muted);font-size:var(--fs-sm)}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:var(--sp-2)}
.rows li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--sp-3) var(--sp-4);display:grid;gap:2px}
.rows b{font-size:var(--fs-sm)}

/* pulse rail (desktop) */
.pulse{padding:var(--sp-4);border-left:1px solid var(--line);background:var(--surface)}
.pulse h2{font-size:var(--fs-lg);margin-bottom:var(--sp-3);font-family:var(--font-display)}
.pulse h3{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:var(--sp-4) 0 var(--sp-2)}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:var(--sp-2)}
.plist li{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);padding:var(--sp-2) 0;border-bottom:1px solid var(--line)}

/* sheet (dialog primitive: role=dialog, aria-modal, Esc, background inert, focus restore) */
.sheet-backdrop{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);animation:fade var(--dur-fade) ease-out}
.sheet{position:absolute;z-index:41;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);color:var(--ink);
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--sp-3) var(--sp-4) var(--sp-5);animation:sheetIn var(--dur-2) var(--ease),fade var(--dur-fade) ease-out}
@keyframes sheetIn{from{transform:translateY(var(--sheet-move))}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@container app (min-width:1024px){.sheet{left:50%;right:auto;bottom:auto;top:12%;width:36rem;transform:translateX(-50%);border-radius:var(--r-lg);animation:fade var(--dur-fade) ease-out}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.sheet-head h2{font-size:var(--fs-xl);font-family:var(--font-display)}
.handle{width:2.5rem;height:.3rem;border-radius:var(--r-pill);background:var(--line);margin:0 auto var(--sp-2)}
.field{display:flex;align-items:center;gap:var(--sp-2);min-height:3.25rem;padding:0 var(--sp-2) 0 var(--sp-4);border:2px solid var(--line);border-radius:var(--r-pill);background:var(--bg)}
.field input{flex:1;border:0;background:none;min-height:var(--target);font-size:var(--fs-body);min-width:0}
.field input:focus{outline:none}
.field:focus-within{border-color:var(--focus)}
.sec-h{font-size:var(--fs-xs);font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:var(--sp-5) 0 var(--sp-2)}

/* toast (live region) */
.toast-wrap{position:absolute;left:50%;transform:translateX(-50%);bottom:6.5rem;z-index:60;pointer-events:none;width:max-content;max-width:90%}
.toast{background:var(--ink);color:var(--bg);font-weight:700;font-size:var(--fs-sm);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-pill);box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity var(--dur-fade)}
.toast.show{opacity:1}
@container app (min-width:1024px){.toast-wrap{bottom:var(--sp-5)}}

/* ================= VARIANT A · GOLD BENTO ================= */
[data-variant="A"] .hdr{background:var(--header);color:var(--on-header);padding:var(--sp-2) var(--sp-4) var(--sp-3)}
[data-variant="A"] .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-2)}
[data-variant="A"] .brand{display:flex;align-items:center;gap:var(--sp-2);font-weight:900;font-size:var(--fs-lg);letter-spacing:.02em}
[data-variant="A"] .brand svg{color:var(--accent)}
[data-variant="A"] .seg{display:flex;gap:var(--sp-1);padding:var(--sp-1);background:rgba(255,255,255,.08);border-radius:var(--r-pill)}
[data-variant="A"] .seg button{flex:1 1 0;min-width:0;min-height:var(--target);border:0;border-radius:var(--r-pill);background:none;color:var(--on-header);font-weight:700;font-size:var(--fs-sm);cursor:pointer;padding:0 var(--sp-2);overflow-wrap:anywhere;line-height:1.15}
[data-variant="A"] .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
[data-variant="A"] .seg button[aria-pressed="true"]::before{content:"✓ ";font-weight:900}
.hdr :focus-visible{outline-color:var(--focus-header)}
[data-variant="A"] .nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:var(--sp-1) var(--sp-1) max(var(--sp-2),env(safe-area-inset-bottom))}
[data-variant="A"] .nav-i,[data-variant="A"] .nav-q{position:relative;min-height:3.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:var(--fs-xs);font-weight:650;border:0;background:none;cursor:pointer;padding:0;border-radius:var(--r-md)}
[data-variant="A"] .nav-i .ic{display:grid;place-items:center;width:3.5rem;height:2rem;border-radius:var(--r-pill);transition:background var(--dur-1)}
[data-variant="A"] .nav-i[aria-current="page"]{color:var(--ink);font-weight:850}
[data-variant="A"] .nav-i[aria-current="page"] .ic{background:var(--accent-soft)}
[data-variant="A"] .nav-q .disc{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-1.6rem;border:4px solid var(--surface);box-shadow:0 6px 16px rgba(0,0,0,.18);transition:transform var(--dur-1) var(--ease)}
[data-variant="A"] .nav-q:active .disc{transform:scale(.94)}
[data-variant="A"] .nav-q{color:var(--ink)}
[data-variant="A"] .now{padding:var(--sp-4);display:grid;gap:var(--sp-3);max-width:60rem;margin:0 auto}
[data-variant="A"] .greet h1{font-size:var(--fs-2xl);line-height:1.2;font-weight:850;letter-spacing:-.01em}
[data-variant="A"] .brief{display:flex;gap:var(--sp-3);background:var(--accent-soft);border-radius:var(--r-card);padding:var(--sp-4)}
[data-variant="A"] .brief .owl{flex:none;width:2.75rem;height:2.75rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
[data-variant="A"] .eyebrow{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.07em;font-weight:850;color:var(--accent-ink)}
[data-variant="A"] .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
@container app (min-width:640px){[data-variant="A"] .grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container app (max-width:340px){[data-variant="A"] .grid{grid-template-columns:1fr}}
[data-variant="A"] .tile{background:var(--surface);border-radius:var(--r-card);padding:var(--sp-4);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
[data-variant="A"] .span2{grid-column:span 2}
@container app (max-width:340px){[data-variant="A"] .span2{grid-column:auto}}
[data-variant="A"] .tile-h{display:flex;align-items:center;gap:var(--sp-2)}
[data-variant="A"] .tile-h h2{font-size:var(--fs-sm);font-weight:850;flex:1}
[data-variant="A"] .tile-h .see{min-height:var(--target);display:inline-flex;align-items:center;font-size:var(--fs-xs);font-weight:800;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;padding:0 var(--sp-1)}
[data-variant="A"] .big{font-size:var(--fs-3xl);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
[data-variant="A"] .big small{font-size:var(--fs-sm);font-weight:700;color:var(--muted);margin-left:.2em}
[data-variant="A"] .lots{list-style:none;margin:0;padding:0;display:grid;gap:var(--sp-3)}

[data-variant="C"] .badge{left:calc(50% + .3rem);top:.1rem}
[data-variant="C"] .now{padding:var(--sp-3) var(--sp-4) var(--sp-5);display:grid;gap:var(--sp-5);max-width:44rem;margin:0 auto}

[data-variant="C"] .carousel{display:flex;gap:var(--sp-3);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--sp-1) var(--sp-4) var(--sp-3);margin:0 calc(-1 * var(--sp-4));list-style:none;scroll-padding-inline:var(--sp-4)}

[data-variant="C"] .tonight .t{font-weight:800;font-size:var(--fs-sm)}
[data-variant="C"] .rail{background:var(--bg);padding:var(--sp-5) var(--sp-4);gap:var(--sp-1);border-right:1px solid var(--line)}
[data-variant="C"] .rail .brand{padding:0 var(--sp-3) var(--sp-5);font-size:var(--fs-2xl)}
[data-variant="C"] .rail a{display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);border-radius:var(--r-pill);color:var(--muted);text-decoration:none;font-weight:700;font-size:var(--fs-lg)}
[data-variant="C"] .rail a[aria-current="page"]{background:var(--ink);color:var(--bg)}
[data-variant="C"] .rail .btn{margin-top:var(--sp-4);min-height:3.25rem}

[data-variant="C"] .ask{width:100%;min-height:3.5rem;border-radius:var(--r-pill);border:0;background:var(--accent);color:var(--on-accent);font-weight:850;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);cursor:pointer}


/* LARGE TEXT MODE (>=150% text on a phone: container narrower than 18em). Same in every variant. */
@container app (max-width:18em){
  .demo-pill>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .demo-pill{min-width:var(--target);justify-content:center}
  .seg,.chips{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .seg button,.chips button{flex:none!important;overflow-wrap:normal!important;white-space:nowrap}
  .seg button[aria-pressed="true"]::before{content:""!important}
  .nav .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .nav .nav-i,.nav .nav-q{min-height:3.75rem}
  [data-variant="C"] .nav{grid-template-columns:repeat(5,minmax(0,1fr))}
  .grid{grid-template-columns:1fr!important}.span2{grid-column:auto!important}
  [data-variant="B"] .brand{display:none}
  [data-variant="B"] .campus-select{margin-left:0;flex:1}
}

/* ================= PROTOTYPE CHROME (not under evaluation; px on purpose) ================= */
.proto-bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fff;color:#111;border-radius:999px;box-shadow:0 0 0 2px #ff2d92,0 10px 30px rgba(0,0,0,.45);font:600 12px/1 system-ui,sans-serif;white-space:nowrap;max-width:calc(100vw - 16px);overflow-x:auto}
.proto-bar button,.proto-bar select{font:inherit;height:32px;border:1px solid #ccc;border-radius:999px;background:#f4f4f4;padding:0 10px;cursor:pointer;color:#111}
.proto-bar .arrow{width:32px;padding:0;font-size:15px}
.proto-bar .lbl{min-width:150px;text-align:center;font-weight:800}
.proto-bar .tag{background:#ff2d92;color:#fff;border-radius:999px;padding:4px 8px;font-weight:900;letter-spacing:.05em}
.proto-bar input[type=range]{width:80px}
.proto-bar label{display:flex;align-items:center;gap:4px}
.tokens{position:fixed;top:0;right:0;bottom:72px;width:min(420px,100vw);z-index:999;background:#fff;color:#111;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.4);font:13px/1.45 system-ui,sans-serif;padding:14px 16px 24px}
.tokens h2{font-size:15px;margin:16px 0 6px}
.tokens h3{font-size:13px;margin:12px 0 4px}
.tokens table{width:100%;border-collapse:collapse;font-size:12px}
.tokens td{padding:4px 4px;border-bottom:1px solid #eee;vertical-align:middle}
.tokens .sw{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2);vertical-align:-3px;margin-right:4px}
.tokens .pass{color:#0a6b2d;font-weight:800}.tokens .fail{color:#b00020;font-weight:800}.tokens .info{color:#555}
.tokens .x{float:right;height:32px;padding:0 12px;border-radius:999px;border:1px solid #ccc;background:#f4f4f4;cursor:pointer}
.tokens ul{padding-left:18px;margin:4px 0}
.tokens code{background:#f1f1f1;padding:0 3px;border-radius:3px}
</style>

<body>
<div class="stage" id="stage">
  <div class="app" id="app">
    <div id="shellRoot"></div>
    <div id="sheetRoot"></div>
    <div class="toast-wrap"><div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div></div>
  </div>
</div>

<div class="proto-bar" role="toolbar" aria-label="Prototype controls (not part of the design)">

const lots=()=>LOTS.filter(l=>state.campus==='All KSU'||l.campus===state.campus).sort((a,b)=>a.pct-b.pct);

/* ---------- state ---------- */

const $=s=>document.querySelector(s);

const railLinks=(short)=>RAIL.map(([k,l,i])=>`<a href="#${k}" data-go="${k}" ${state.tab===k?'aria-current="page"':''}>${icon(i,22)}<span>${short?(k==='marketplace'?'Market':l.split(' ')[0]):l}</span></a>`).join('');

    :`<a href="#${n.k}" class="nav-i" data-go="${n.k}" ${state.tab===n.k?'aria-current="page"':''}><span class="ic">${icon(n.icon,22)}</span><span class="lbl">${n.label}</span>${n.badge?`<span class="badge">${n.badge}<span class="sr"> unread</span></span>`:''}</a>`).join('')}</nav></div>`,

  <section class="lede" aria-labelledby="lede-h"><h2 id="lede-h" class="sr">Scrappy's brief</h2><blockquote>${brief()}</blockquote>
   <p class="src">${icon('owl',16)}Scrappy · from Parking Reports and Big Owl Bus GPS · 1:42 PM</p>
   <div><button class="btn" data-act="sheet" aria-haspopup="dialog">Ask a follow-up</button></div></section>
  <section aria-labelledby="c-park"><div class="sec-row"><h2 id="c-park">Parking</h2><a class="btn-link" href="#parking" data-go="parking">Map &amp; all lots</a></div>
   <ul class="carousel" tabindex="0" role="region" aria-label="Parking lots, scrolls sideways" data-keys>${lots().map(l=>`<li><span class="meta">${l.name}</span><span class="pct">${l.pct}%</span>${chip(l.status)}${fillBar(l)}<span class="meta">${l.walk}<br>${l.seen}</span></li>`).join('')}</ul>
   <button class="btn" data-toast="Thanks! Nearby drivers will see a Spot Opening">${icon('car',18)}I'm leaving, share my spot</button></section>
  <article class="story" aria-labelledby="c-bus"><p class="kicker">${icon('bus',16)}Big Owl Bus</p><h3 id="c-bus">${b.route} in ${b.mins} minutes</h3><p class="muted">From ${b.stop}. ${b.note}, next one at ${b.next}.</p><div class="acts"><button class="btn primary" data-toast="Reminder set: ${b.route} in ${b.mins} min">Remind me</button><a class="btn" href="#transit" data-go="transit">Live map</a></div></article>
  <article class="story" aria-labelledby="c-study"><p class="kicker">${icon('book',16)}Study</p><h3 id="c-study">Room 236 in Sturgis is free until 4:30</h3><p class="muted">3 rooms open right now. Walk-ins say it's quiet.</p><div class="acts"><a class="btn" href="#study" data-go="study">See rooms</a></div></article>
  <article class="story" aria-labelledby="c-dine"><p class="kicker">${icon('food',16)}Dining</p><h3 id="c-dine">The Commons has a short line</h3><p class="muted">About 3 minutes. Stingers is backed up (~15 min).</p></article>
  <section class="story" aria-labelledby="c-tn"><p class="kicker">${icon('cal',16)}Tonight</p><h3 id="c-tn">Two things on your radar</h3><ul class="tonight"><li><span class="t">6:00 PM</span><span><b>CS 3305 exam prep</b><br><span class="meta">Study Session · Johnson Library · 7 going</span></span></li><li><span class="t">7:00 PM</span><span><b>ACM Hack Night</b><br><span class="meta">Event · Atrium · ACM @ KSU</span></span></li></ul></section>
 </div>`;},
 sheet:()=>`<div class="handle" aria-hidden="true"></div><div class="sheet-head"><h2 id="sheet-h">What do you need?</h2><button class="icon-btn" data-act="close" aria-label="Close">${icon('x')}</button></div>
  <form class="field" data-act="ask"><label for="ask" class="sr">Ask Scrappy</label>${icon('owl',22)}<input id="ask" placeholder="Ask Scrappy…" autocomplete="off"><button class="icon-btn" aria-label="Send to Scrappy">${icon('send',18)}</button></form>
  <h3 class="sec-h">Make something</h3><div class="tiles">${CREATES.map(([t,d,i])=>`<button data-toast="${t} composer opens here">${icon(i,22)}<b>${t}</b><span>${d}</span></button>`).join('')}</div>
  <h3 class="sec-h">Everything else</h3><ul class="capchips">${CAPS.map(([k,l,i])=>`<li><a href="#${k}" data-go="${k}">${icon(i,18)}${l}</a></li>`).join('')}</ul>`,
};
const RENDER={A,B,C};

/* ---------- render ---------- */
function render(focusSel){
  const v=state.variant, theme=state.theme==='default'?VARIANTS[v].theme:state.theme;
  app.dataset.variant=v; app.dataset.theme=theme; app.dataset.motion=state.motion;
  $('#stage').dataset.frame=state.frame;
  document.documentElement.style.fontSize=state.text+'%';
  const R=RENDER[v];
  $('#shellRoot').innerHTML=R.shell();
  $('#shellRoot').inert=state.sheet;
  $('#sheetRoot').innerHTML=state.sheet?`<div class="sheet-backdrop" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">${R.sheet()}</div>`:'';
  $('#vlabel').textContent=`${v} · ${VARIANTS[v].name}`;
  $('#ctlTheme').value=state.theme; $('#ctlMotion').value=state.motion; $('#ctlText').value=state.text; $('#textOut').textContent=state.text+'%'; $('#ctlFrame').value=state.frame;
  $('#tokens').hidden=!state.tokens; $('#ctlTokens').setAttribute('aria-expanded',state.tokens);
  if(state.tokens) renderTokens();
  const p=new URLSearchParams({variant:v}); if(state.theme!=='default')p.set('theme',state.theme); if(state.motion!=='system')p.set('motion',state.motion);
  if(state.text!==100)p.set('text',state.text); p.set('frame',state.frame); if(state.tokens)p.set('tokens','1');
  history.replaceState(null,'','?'+p);
  if(focusSel){const el=app.querySelector(focusSel); if(el) el.focus({preventScroll:false});}
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent='';t.classList.remove('show');clearTimeout(toastT);
  setTimeout(()=>{t.textContent=msg;t.classList.add('show');toastT=setTimeout(()=>t.classList.remove('show'),3200)},60);}
function openSheet(trigger){lastTrigger=trigger?.dataset.act==='sheet'?(trigger.closest('.nav,.rail')?trigger.className.split(' ')[0]:null):null;state.sheet=true;state.demo=false;render('#ask');}
function closeSheet(){state.sheet=false;render(lastTrigger?`.${lastTrigger}`:'#main-h');}
function go(k){state.tab=k;state.sheet=false;state.demo=false;render('#main-h');$('#main').scrollTop=0;}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-campus],[data-persona],[data-toast],a.skip');if(!t)return;
  if(t.matches('a.skip')){e.preventDefault();app.querySelector('#main-h')?.focus();return;}
  if(t.dataset.go){e.preventDefault();go(t.dataset.go);return;}
  if(t.dataset.campus){state.campus=t.dataset.campus;render('#campus-'+t.dataset.campus.replace(/\W/g,''));toast(`Showing ${t.dataset.campus}`);return;}
  if(t.dataset.persona){const p=PERSONAS.find(x=>x.name===t.dataset.persona);state.persona=p.name;state.campus=p.campus;state.demo=false;render('.demo-pill');toast(`Demo persona: ${p.name}`);return;}
  if(t.dataset.toast&&!t.dataset.act){if(state.sheet){state.sheet=false;render(lastTrigger?`.${lastTrigger}`:'#main-h');}toast(t.dataset.toast);return;}
  const a=t.dataset.act;
  if(a==='sheet'){e.preventDefault();openSheet(t);}
  else if(a==='close'){closeSheet();}
  else if(a==='demo'){state.demo=!state.demo;render('.demo-pill');}
});
app.addEventListener('submit',e=>{e.preventDefault();const v=$('#ask')?.value.trim();closeSheet();toast(v?`Scrappy is answering: “${v}”`:'Type a question for Scrappy first');});
app.addEventListener('change',e=>{if(e.target.matches('[data-campus-select]')){state.campus=e.target.value;render('#campusSel');toast(`Showing ${state.campus}`);}});
app.addEventListener('input',e=>{if(!e.target.matches('[data-filter]'))return;const q=e.target.value.toLowerCase();let n=0;
  app.querySelectorAll('.cmd li').forEach(li=>{const hit=!q||li.dataset.name.toLowerCase().includes(q);li.hidden=!hit;if(hit)n++;});
  $('#cmdcount').textContent=`Press Enter to ask Scrappy. ${n} matching action${n===1?'':'s'}.`;});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(state.sheet){e.preventDefault();closeSheet();return;}if(state.demo){state.demo=false;render('.demo-pill');return;}if(state.tokens){state.tokens=false;render();$('#ctlTokens').focus();return;}}
  const el=document.activeElement;
  if(el&&(el.matches('input,textarea,select,[contenteditable],[contenteditable] *')||el.closest('[data-keys]')))return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){if(e.altKey||e.metaKey||e.ctrlKey)return;cycle(e.key==='ArrowRight'?1:-1);}
});
function cycle(d){const i=KEYS.indexOf(state.variant);state.variant=KEYS[(i+d+KEYS.length)%KEYS.length];state.sheet=false;state.demo=false;render();}
$('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);
$('#ctlTheme').onchange=e=>{state.theme=e.target.value;render();};
$('#ctlMotion').onchange=e=>{state.motion=e.target.value;render();};
$('#ctlText').oninput=e=>{state.text=+e.target.value;render();};
$('#ctlFrame').onchange=e=>{state.frame=e.target.value;render();};
$('#ctlTokens').onclick=()=>{state.tokens=!state.tokens;render();};

/* ---------- tokens drawer: live contrast from computed custom properties ---------- */
const hexRgb=h=>{h=h.trim().replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
const lum=([r,g,b])=>{const f=c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4};return .2126*f(r)+.7152*f(g)+.0722*f(b);};
const ratio=(a,b)=>{const [x,y]=[lum(hexRgb(a)),lum(hexRgb(b))].sort((m,n)=>n-m);return (x+.05)/(y+.05);};
const PAIRS=[['ink','bg','text'],['ink','surface','text'],['muted','surface','text'],['muted','bg','text'],['accent-ink','surface','text'],['accent-ink','bg','text'],['on-accent','accent','text'],['on-header','header','text'],['header-muted','header','text'],['demo-ink','demo','text'],['ink','accent-soft','text'],
  ['open-fg','open-bg','text'],['filling-fg','filling-bg','text'],['full-fg','full-bg','text'],['open-mark','surface','ui'],['filling-mark','surface','ui'],['full-mark','surface','ui'],['focus','surface','ui'],['focus','bg','ui'],['focus-header','header','ui'],['accent','surface','info'],['line','surface','info']];
const NOTES={
 A:['<b>Structure:</b> dark KSU-black header with a full-width segmented Campus switcher; 2-col bento (4-col ≥640) of rounded tiles; raised gold center disc in a labelled 5-slot bar; Quick Sheet = half sheet with Ask field, 2×2 create, 2×5 jump grid (spec as-is).',
   '<b>Nav contract:</b> unchanged. Visible label “Market” (accessible name “Market”) instead of “Marketplace” to fit 5 slots at 200% text; flag if the full word matters.',
   '<b>Feel:</b> closest to today’s app, polished. Brand-forward gold, playful but busy at 200% text.'],
 B:['<b>Structure:</b> one-row header with a native <code>&lt;select&gt;</code> Campus picker (most robust for AT + 200% text); Now = parking gauge strip + a single time-ordered “Up next” board instead of tiles; flat tab bar with top indicator; center slot same size (“Scrappy”); Quick Sheet becomes a full-height command palette (Ask field doubles as filter).',
   '<b>Nav contract:</b> the 2×5 grid becomes a filterable list. Same 10 destinations and 4 composers, same URLs, so SPEC §3 still holds in substance, but the “2×5 icon grid” wording would change. Desktop rail is icon+short-label (4.5rem).',
   '<b>Feel:</b> dark-first, dense, utilitarian transit-board; most information per screen, least decoration. Mono numerals.'],
 C:['<b>Structure:</b> light warm paper; header = wordmark + chip Campus switcher; Now leads with Scrappy’s brief as an editorial headline <i>with provenance line</i>, then a sideways parking carousel and full-width story cards; floating rounded dock where the center slot is a wide “Ask Scrappy” pill; Quick Sheet = big composer tiles + capability chips.',
   '<b>Nav contract:</b> unchanged (still 5 slots, same URLs). The center slot is labelled “Ask Scrappy” rather than “Quick”, which leans the Quick Sheet toward Scrappy-first. Floating dock overlaps content, so main gets bottom padding (2.4.11 focus-not-obscured).',
   '<b>Feel:</b> calm, friendly, most “enjoyable”; lowest density (more scrolling), serif display type.']};
function renderTokens(){
  const cs=getComputedStyle(app),v=n=>cs.getPropertyValue('--'+n).trim();
  const rows=PAIRS.map(([f,b,k])=>{const r=ratio(v(f),v(b));const need=k==='text'?4.5:k==='ui'?3:null;
    const cls=need==null?'info':r>=need?'pass':'fail';
    return `<tr><td><span class="sw" style="background:${v(f)}"></span><code>--${f}</code></td><td><span class="sw" style="background:${v(b)}"></span><code>--${b}</code></td><td style="background:${v(b)};color:${v(f)};font-weight:700;text-align:center">Aa</td><td class="${cls}">${r.toFixed(2)}:1 ${need?(r>=need?'✓':'✗')+' ≥'+need:'(decorative)'}</td></tr>`;}).join('');
  const fails=PAIRS.filter(([f,b,k])=>k!=='info'&&ratio(v(f),v(b))<(k==='text'?4.5:3)).length;
  const fs=['xs','sm','body','lg','xl','2xl','3xl'];
  $('#tokens').innerHTML=`<button class="x" id="tokClose">Close</button>
  <h2 style="margin-top:4px">${state.variant} · ${VARIANTS[state.variant].name} (${app.dataset.theme})</h2>
  <ul>${NOTES[state.variant].map(n=>`<li>${n}</li>`).join('')}</ul>
  <h2>Contrast pairs <span class="${fails?'fail':'pass'}">${fails?fails+' failing':'all pass'}</span></h2>
  <p class="info">Computed live from the variant’s custom properties. Text ≥4.5:1 (1.4.3), UI/marks/focus ≥3:1 (1.4.11). Status never relies on colour: icon shape (empty/half/full) + word + bar pattern.</p>
  <table>${rows}</table>
  <h2>Type scale (rem, scales with user text size)</h2>
  <table>${fs.map(k=>`<tr><td><code>--fs-${k}</code></td><td>${v('fs-'+k)}</td><td style="font-family:${v(k.includes('xl')?'font-display':'font-body')};font-size:calc(${v('fs-'+k)} * 16px / 1rem)">Campus Loop</td></tr>`).join('')}</table>
  <p class="info">Display font: <code>${v('font-display').split(',')[0]}</code> · Numerals: <code>${v('font-num').split(',')[0]}</code>. No text below 13px (0.8125rem). Zero fixed-px text in the app.</p>
  <h2>Space, shape, targets, motion</h2>
  <table>
   <tr><td>spacing</td><td>${['1','2','3','4','5','6'].map(k=>v('sp-'+k)).join(' · ')}</td></tr>
   <tr><td>radius</td><td>sm ${v('r-sm')} · md ${v('r-md')} · lg ${v('r-lg')} · card ${v('r-card')} · pill</td></tr>
   <tr><td>target</td><td><code>--target</code> ${v('target')} (44px) on every control; floor ${v('target-min')} (2.5.8)</td></tr>
   <tr><td>focus</td><td>${v('focus-w')} solid <code>--focus</code>, 2px offset</td></tr>
   <tr><td>motion</td><td>fast ${v('dur-1')} · sheet ${v('dur-2')} · fade ${v('dur-fade')} · reduced ⇒ 0ms movement, fades only</td></tr>
  </table>
  <h2>Components to carry into the spec</h2>
  <ul><li>Dialog/sheet primitive: <code>role=dialog</code> + <code>aria-modal</code>, Esc closes, background <code>inert</code>, focus to first field, restored to trigger.</li>
  <li>Toast = single persistent <code>role=status</code> live region (announces Spot Opening, reminders, Campus switch).</li>
  <li>Status chip + fill bar (shape + word + pattern + colour).</li>
  <li>One labelled <code>nav</code> per layout (bottom bar or rail, never both exposed).</li>
  <li>Skip link, <code>h1</code> per screen, focus moves to <code>h1</code> on tab change.</li>
  <li>Judge Demo pill + menu (disclosure, Esc closes).</li>
  <li><b>Large-text mode (decision for the human):</b> at ≥150% text on a phone, the bottom bar keeps icons and moves its labels to accessible names only (iOS tab-bar convention), the Demo pill collapses to ⚡, the Campus switcher scrolls sideways, and bento grids go to 1 column. Try it with the Text slider.</li></ul>`;
  $('#tokClose').onclick=()=>{state.tokens=false;render();$('#ctlTokens').focus();};
}
addEventListener('resize',()=>{if(state.tokens)renderTokens();});
render();
</script>
</body>
