const hexRgb=h=>{h=h.trim().replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
const lum=([r,g,b])=>{const f=c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4};return .2126*f(r)+.7152*f(g)+.0722*f(b);};
const ratio=(a,b)=>{const [x,y]=[lum(hexRgb(a)),lum(hexRgb(b))].sort((m,n)=>n-m);return (x+.05)/(y+.05);};
const PAIRS=[['ink','bg','text'],['ink','surface','text'],['ink','surface-2','text'],['muted','surface','text'],['muted','bg','text'],['muted','surface-2','text'],['accent-ink','surface','text'],['accent-ink','bg','text'],['on-accent','accent','text'],['ink','accent-soft','text'],['muted','accent-soft','text'],
 ['ok-fg','ok-bg','text'],['warn-fg','warn-bg','text'],['bad-fg','bad-bg','text'],['bad-fg','surface','text'],['ken-fg','ken-bg','text'],['mar-fg','mar-bg','text'],
 ['open-fg','open-bg','text'],['filling-fg','filling-bg','text'],['nearly-fg','nearly-bg','text'],['full-fg','full-bg','text'],
 ['open-mark','surface','ui'],['filling-mark','surface','ui'],['nearly-mark','surface','ui'],['full-mark','surface','ui'],['line-strong','surface','ui'],['focus','surface','ui'],['focus','bg','ui'],['demo','bg','ui'],['ink','map-land','text']];
function renderTokens(){
  const cs=getComputedStyle(app),v=n=>cs.getPropertyValue('--'+n).trim();
  const rows=PAIRS.map(([f,b,k])=>{const r=ratio(v(f),v(b));const need=k==='text'?4.5:3;const ok=r>=need;return `<tr><td><span class="sw" style="background:${v(f)}"></span><code>--${f}</code></td><td><span class="sw" style="background:${v(b)}"></span><code>--${b}</code></td><td class="${ok?'pass':'fail'}">${r.toFixed(2)}:1 ${ok?'✓':'✗'} ≥${need}</td></tr>`;}).join('');
  const fails=PAIRS.filter(([f,b,k])=>ratio(v(f),v(b))<(k==='text'?4.5:3)).length;
  $('#tokens').innerHTML=`<button class="x" id="tokClose">Close</button><h2 style="margin-top:4px">Direction C · full app (${S.theme})</h2>
  <h2>Decisions under test in this round</h2><ul>
   <li><b>Campus is a “where am I” setting, not a global filter.</b> The switcher only appears on Now, Parking, Transit, Study, Dining and Events (location-bound). Feed, Marketplace, Chats, Scrappy, Course Hubs, Clubs, Profile and Moderation show everyone at KSU, and each post or listing carries a campus badge. <i>Reopens SPEC §3 (“sticky” switcher + Feed default filtered) and the Map #1 verdict.</i></li>
   <li><b>Marketplace and Clubs</b> get a local “Any campus / Kennesaw / Marietta” filter; Marketplace sorts your home campus first.</li>
   <li><b>Feed stream</b> “Campus” is renamed “All KSU” (same data, KSU-wide).</li>
   <li><b>Chat-like screens</b> (a chat thread, Ask Scrappy) hide the dock so the message box sits at the bottom; the header shows Back.</li>
   <li><b>Listings are photo-first:</b> square cover photo, photo count, full gallery with thumbnails, up to 4 photos in the composer (unchanged limit).</li>
   <li><b>Desktop rail</b> groups 14 destinations under Everyday / Campus life / You; Quick Sheet button kept.</li></ul>
  <h2>Contrast <span class="${fails?'fail':'pass'}">${fails?fails+' failing':'all pass'}</span></h2><p class="info">Live from computed tokens. Text ≥4.5:1, UI marks/focus ≥3:1. Lot status = shape (○ ◐ ◕ ●) + word + bar pattern + colour.</p><table>${rows}</table>
  <h2>Type, space, shape</h2><table><tr><td>type (rem)</td><td>${['xs','sm','body','lg','xl','2xl','3xl'].map(k=>v('fs-'+k)).join(' · ')}</td></tr><tr><td>display</td><td>${v('font-display').split(',')[0]} (headings, numbers); system UI for body</td></tr><tr><td>space</td><td>${[1,2,3,4,5,6].map(k=>v('sp-'+k)).join(' · ')}</td></tr><tr><td>radius</td><td>sm ${v('r-sm')} · md ${v('r-md')} · lg ${v('r-lg')} · card ${v('r-card')} · pill</td></tr><tr><td>target</td><td>${v('target')} (44 px) on every control</td></tr><tr><td>motion</td><td>${v('dur-1')} / sheet ${v('dur-2')} / fade ${v('dur-fade')}; reduced = fades only</td></tr></table>
  <h2>Components to carry into the spec</h2><ul><li>Dialog/sheet primitive (role=dialog, aria-modal, Esc, inert background, focus in + restore): Quick Sheet, listing detail, sell form, replies, report, OTP, onboarding.</li><li>Toast region (role=status) + new-message toast.</li><li>Photo picker (≤4, thumbnails, remove buttons, file input with visible label) and gallery (prev/next, thumbnails, arrow keys).</li><li>Status chip + bar (shape + word + pattern), campus badge (word, not colour).</li><li>Map frame: zoom buttons, legend, attribution, list equivalent.</li><li>Segmented control (aria-pressed), tabs (arrow keys), labelled selects, check rows.</li><li>Report dialog with “not police” callout for Campus Safety.</li></ul>`;
  $('#tokClose').onclick=()=>{S.tokens=false;syncCtl();$('#ctlTokens').focus();};
}
render({focusMain:false});
