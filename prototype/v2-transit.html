const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const rcol=r=>S.theme==='dark'?r.d:r.c;
const onCol=c=>ratio(c,'#1F1A14')>=ratio(c,'#FFFFFF')?'#1F1A14':'#FFFFFF';
const badge=(r,sm)=>{const c=rcol(r);return `<span class="rb ${sm?'sm':''} ${notRunning(r)?'off':''}" style="--rc:${c};background:${c};color:${onCol(c)}" aria-hidden="true"><b>${r.code}</b><i class="dash-${r.dash}"></i></span>`;};
const rName=r=>`${r.code} ${r.name.replace(new RegExp('^'+r.code+' '),'')}`;

/* ===================== ICONS ===================== */
const P={pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',chev:'<path d="m6 9 6 6 6-6"/>',up:'<path d="m18 15-6-6-6 6"/>',locate:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/>',
 map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
 home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',rss:'<path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/>',
 bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',chat:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
 owl:'<path d="M5 9c0-3.5 3-6 7-6s7 2.5 7 6v6a7 7 0 0 1-14 0Z"/><circle cx="9" cy="10.5" r="2"/><circle cx="15" cy="10.5" r="2"/><path d="m11 14.5 1 1.2 1-1.2"/><path d="M5 5 7 7M19 5l-2 2"/>',
 bus:'<rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 11h16M8 3v8M16 3v8"/><circle cx="8" cy="18" r="1.5"/><circle cx="16" cy="18" r="1.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
 clear:'<path d="M20 6 9 17l-5-5"/>',long:'<circle cx="6" cy="8" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="18" cy="8" r="2"/><path d="M4 20v-4a2 2 0 0 1 4 0v4M10 20v-4a2 2 0 0 1 4 0v4M16 20v-4a2 2 0 0 1 4 0v4"/>',
 full:'<rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 11h16"/><path d="m9 6 6 0" /><path d="M2 21 22 1"/>',notice:'<path d="M4 4h16v12H5.2L4 17.2z"/><path d="M8 8h8M8 12h5"/>',
 star2:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'};
const ic=(n,s=20)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${P[n]||''}</svg>`;

/* ===================== COPY HELPERS ===================== */
const ago=()=>Math.round((Date.now()-S.lastFetch)/1000);
function feedPill(){if(S.feed==='offline')return `<span class="dotest"></span>Offline · routes &amp; stops only`;
  if(!live())return `<span class="dotest"></span>Bus GPS not updating · last ${Math.max(1,Math.round(ago()/60))} min ago`;
  return `<span class="dotlive"></span>Live GPS · Passio · <span id="agoTxt" class="num">${ago()}</span> s ago`;}
function arrivalText(r,stopId){
  if(notRunning(r))return {t:'Not today',sub:'Runs Fri–Sun',sched:true,sr:`${rName(r)} does not run today. It runs Friday to Sunday, 11 AM to 7 PM.`};
  const m=live()?etaMin(r,stopId):null;
  if(m==null)return {t:`~${HEADWAY[r.code]}`,sub:'min · schedule',sched:true,sr:`${rName(r)}: no live bus position. Scheduled about every ${HEADWAY[r.code]} minutes.`};
  return {t:m<=1?'Now':`${m}`,sub:m<=1?'arriving':'min · live',sched:false,sr:`${rName(r)}: ${m<=1?'arriving now':m+' minutes'}, live GPS.`};
}
const noticesFor=code=>NOTICES.filter(n=>n.routes.includes(code));
function noticeEl(n,open){return `<details class="snotice" ${open?'open':''}><summary>${ic('notice',18)}<span>${esc(n.title)}</span></summary><p>${esc(n.body)}</p><span class="src">Shuttle Notice · from Big Owl Bus via Passio GO · posted ${esc(n.posted)} · not a KSU safety Alert</span></details>`;}
function repList(id){const rs=(S.reports[id]||[]).filter(x=>x.ago<15);if(!rs.length)return `<p class="meta">No stop reports in the last 15 min.</p>`;
  return `<ul class="pulses">${rs.map(x=>`<li>${ic(x.k,18)}<b>${REP[x.k][1]}</b>${x.route?` <span class="meta">(${x.route})</span>`:''}<span class="meta">· ${x.mine?'you · just now':`${x.n} Student${x.n>1?'s':''} · ${x.ago} min ago`}</span>${x.mine?` <button class="link" data-a="undoRep" data-x="${id}">Undo</button>`:''}</li>`).join('')}</ul>`;}

/* ===================== RENDER PIECES ===================== */
const mapHost=document.createElement('div');mapHost.id='map';
let map=null,lastTrigger=null;
const DOCK=[['now','Now','home'],['feed','Feed','rss'],null,['marketplace','Market','bag'],['chats','Chats','chat']];
const listTarget=()=>S.layout==='board'?'#board-h':S.layout==='strip'?'#strip-h':'#routes-h';
function header(){
  return `<header class="hdr"><div class="hdr-row"><a class="brand brand-m" href="#" aria-label="KSUX home"><span class="dot"></span>KSUX</a><span class="hdr-title h1" style="text-align:center">Transit</span><button class="demo-pill" type="button">${ic('zap',16)}<span>Demo</span></button></div>
  <div class="campus-chips" role="group" aria-label="Campus for transit">${['Kennesaw','Marietta','All KSU'].map(c=>`<button id="cmp-${c.replace(' ','')}" data-a="campus" data-x="${c}" aria-pressed="${S.campus===c}">${S.campus===c?ic('pin',16):''}${c}</button>`).join('')}</div></header>`;
}
function legend(){
  const rs=routesShown();
  return `<div class="legend-card" id="legendCard"><b>Routes</b><ul>${rs.map(r=>`<li><span class="lsample dash-${r.dash}" style="--rc:${rcol(r)};border:1px solid var(--line)"></span><span>${badge(r,true)} ${esc(r.name)} · ${DASHN[r.dash]}</span></li>`).join('')}</ul>
   <b>Buses</b><ul><li><span class="busg">${ic('bus',16)}</span><span>Live GPS (updates every 12 s). The point shows direction. Code under it.</span></li><li><span class="busg stale">${ic('bus',16)}</span><span>Dashed and faded: no update for 36 s+. Shows its last spot.</span></li></ul>
   <b>Stops</b><ul><li><span class="busg" style="width:1rem;height:1rem;border-width:2.5px"></span><span>Stop. Name shows when zoomed in. Blue ring = selected.</span></li></ul>
   <span class="meta">Every route, stop and bus is also in the list below, in the same order.</span></div>`;
}
function mapFrame(){
  const collapsed=S.layout==='board'&&!S.mapOpen;
  return `<section class="map-wrap ${collapsed?'collapsed':''}" aria-label="Shuttle map">
   <a class="skip-map" href="${listTarget()}">Skip map, go to the ${S.layout==='board'?'stop':'route'} list</a>
   ${S.layout==='board'?`<button class="btn" id="mapToggle" data-a="mapToggle" aria-expanded="${S.mapOpen}" style="${collapsed?'':'position:absolute;left:calc(var(--sp-2) + 6rem);top:var(--sp-2);z-index:3'}">${ic('map',16)}${S.mapOpen?'Hide map':'Show map'}</button>`:''}
   <div id="mapSlot"></div>
   <p class="feed-pill" id="feedPill">${feedPill()}</p>
   <button class="btn legend-btn" id="legendBtn" data-a="legend" aria-expanded="${S.legend}" aria-controls="legendCard">${ic('info',18)}Key</button>
   ${S.legend?legend():''}
   <div class="ctrls" role="group" aria-label="Map controls"><button class="icon-btn" id="zin" data-a="zoom" data-x="1" aria-label="Zoom in">${ic('plus',20)}</button><hr><button class="icon-btn" id="zout" data-a="zoom" data-x="-1" aria-label="Zoom out">${ic('minus',20)}</button><hr><button class="icon-btn" id="recenter" data-a="recenter" aria-label="Back to ${esc(S.campus)} routes">${ic('locate',20)}</button></div>
  </section>`;
}
function watchCard(){
  const s=byStop[S.watch];if(!s)return '';const rs=routesAt(s.id).sort((a,b)=>(etaMin(a,s.id)??99)-(etaMin(b,s.id)??99));
  return `<div class="nextcard"><div class="spread"><span class="kicker" style="color:var(--muted)">${ic('star',14)}Your stop</span><button class="link" data-a="pickWatch" id="pickWatch">Change</button></div>
   <button class="link" style="font-family:var(--font-display);font-size:var(--fs-lg);text-decoration:none;color:var(--ink)" data-a="stop" data-x="${s.id}" id="wc-${s.id}">${esc(s.name)}</button>
   <ul class="arr">${rs.slice(0,3).map(r=>{const a=arrivalText(r,s.id);return `<li class="${a.sched?'sched':''}">${badge(r,true)}<span class="nm"><b>${esc(r.name)}</b><span class="meta">${a.sched?'<span class="dotest"></span> ':'<span class="dotlive"></span> '}${esc(a.sub)}</span></span><span class="eta num" aria-hidden="true">${a.t}</span><span class="sr">${esc(a.sr)}</span></li>`;}).join('')}</ul></div>`;
}
function stopDetail(id,scope){
  const s=byStop[id];if(!s)return '';const rs=routesAt(id);const mine=S.mine&&S.mine.stop===id?S.mine.k:null;
  return `<section class="stopd" aria-labelledby="sd-h-${scope}">
   <div class="spread"><h3 id="sd-h-${scope}" tabindex="-1">${esc(s.name)}</h3><button class="icon-btn" data-a="closeStop" aria-label="Close stop ${esc(s.name)}">${ic('x')}</button></div>
   <p class="meta">${s.campus} · stop ${esc(s.id)} · ${rs.length} route${rs.length>1?'s':''}</p>
   <ul class="arr">${rs.map(r=>{const a=arrivalText(r,id);return `<li class="${a.sched?'sched':''}">${badge(r,true)}<span class="nm"><b>${esc(r.name)}</b><span class="meta">${a.sched?'<span class="dotest"></span> ':'<span class="dotlive"></span> '}${esc(a.sub)}</span></span><span class="eta num" aria-hidden="true">${a.t}</span><span class="sr">${esc(a.sr)}</span></li>`;}).join('')}</ul>
   ${rs.flatMap(r=>noticesFor(r.code)).filter((n,i,a)=>a.indexOf(n)===i).map(n=>noticeEl(n,false)).join('')}
   <fieldset><legend>At this stop right now? Tapping posts a stop report for 15 min.</legend><div class="repbtns">${Object.keys(REP).map(k=>`<button class="btn" id="rep-${scope}-${k}" data-a="report" data-x="${id}:${k}" aria-pressed="${mine===k}">${ic(k,20)}<span>${REP[k][0]}</span></button>`).join('')}</div></fieldset>
   <div><b class="lbl">Stop reports · last 15 min</b>${repList(id)}</div>
   <p class="meta">Anonymous to other Students. Fades after 15 min. Not sent to Big Owl Bus or KSU Parking &amp; Transportation.</p>
   <div class="row"><button class="btn" id="watch-${scope}" data-a="watch" data-x="${id}" aria-pressed="${S.watch===id}">${ic('star',16)}${S.watch===id?'Your stop':'Make this your stop'}</button><button class="btn" id="som-${scope}" data-a="showStop" data-x="${id}">${ic('map',16)}Show on map</button></div>
  </section>`;
}
function busesOn(r){return BUSES.filter(b=>b.route===r.code);}
function stopLine(r,scope){
  // stops in route order with buses placed between them
  const ord=r.stopsOrdered,items=[];const bs=busesOn(r);
  ord.forEach((id,i)=>{const s0=r.sAt[id],s1=i+1<ord.length?r.sAt[ord[i+1]]:r.L+r.sAt[ord[0]];
    items.push({stop:id});bs.forEach(b=>{const bsn=b.s<s0?b.s+r.L:b.s;if(bsn>=s0&&bsn<s1)items.push({bus:b,next:ord[(i+1)%ord.length]});});});
  return `<ol class="stoplist" style="--rc:${rcol(r)};--ls:${r.dash==='solid'?'solid':r.dash==='dash'?'dashed':'dotted'}" aria-label="${esc(rName(r))} stops in order">${items.map(it=>{
    if(it.bus){const st=!live()||S.feed==='offline';if(S.feed==='offline')return '';return `<li class="bus"><span class="busmark"><span class="busg ${st?'stale':''}">${ic('bus',16)}</span></span><span class="meta">${st?'Last seen':'Bus'} heading to ${esc(byStop[it.next].name)} · ${esc(it.bus.load)}${st?' · position not updating':''}</span></li>`;}
    const a=arrivalText(r,it.stop),rp=(S.reports[it.stop]||[]).filter(x=>x.ago<15);
    return `<li><span><button class="sname" id="sn-${scope}-${r.code}-${it.stop}" data-a="stop" data-x="${it.stop}">${esc(byStop[it.stop].name)}</button>${rp.length?` <span class="chip outline">${ic(rp[0].k,14)}${REP[rp[0].k][1]}</span>`:''}</span><span class="eta-s num ${a.sched?'sched':''}" aria-label="${esc(a.sr)}">${a.sched?a.t+' '+a.sub.replace(' · ',' '):a.t==='Now'?'Now':a.t+' min'}</span></li>`;}).join('')}</ol>`;
}
function routeRow(r){
  const open=S.route===r.code,ns=noticesFor(r.code),bs=busesOn(r);
  const status=notRunning(r)?'Not running today':S.feed==='offline'?'Hours only (offline)':live()?`${bs.length} bus${bs.length>1?'es':''} live`:`${bs.length} bus${bs.length>1?'es':''} · position not updating`;
  return `<li class="rrow ${open?'sel':''}" id="rt-${r.code}"><div class="rrow-h">${badge(r)}
   <button class="expand" id="rx-${r.code}" data-a="route" data-x="${r.code}" aria-expanded="${open}" aria-controls="rd-${r.code}"><span class="nm">${esc(r.name)}</span><span class="meta">${esc(status)} · ${esc(r.hours)}</span>
    ${ns.length?`<span class="meta">${ic('notice',14)} ${ns.length} Shuttle Notice</span>`:''}<span class="sr">${DASHN[r.dash]} on the map.</span></button>${ic(open?'up':'chev',18)}</div>
   ${open?`<div class="stack" id="rd-${r.code}">${ns.map(n=>noticeEl(n,true)).join('')}${notRunning(r)?'<p class="note">Runs Friday–Sunday, 11 AM – 7 PM. Stops are shown for planning.</p>':''}${stopLine(r,'a')}
     <div class="row"><button class="btn" id="only-${r.code}" data-a="only" data-x="${r.code}" aria-pressed="${S.only===r.code}">${ic('map',16)}${S.only===r.code?'Showing only '+r.code:'Show only '+r.code+' on map'}</button></div></div>`:''}</li>`;
}
function routeChips(){return `<div class="filters-r" role="group" aria-label="Show on map">${[null,...routesShown().map(r=>r.code)].map(c=>`<button class="rchip" id="oc-${c||'all'}" data-a="only" data-x="${c||''}" aria-pressed="${S.only===c}">${c?badge(byCode[c],true)+'<span class="sr">'+esc(byCode[c].name)+'</span>':'<span style="padding:0 var(--sp-2)">All routes</span>'}</button>`).join('')}</div>`;}

/* ---- Layout A: map + bottom sheet ---- */
function layA(){
  const lab={peek:'Show routes',half:'Show all routes',full:'Show more map'}[S.snap];const rs=routesShown();
  const nc=NOTICES.filter(n=>n.routes.some(c=>rs.includes(byCode[c]))).length;
  return mapFrame()+`<section class="sheet" data-snap="${S.snap}" aria-labelledby="routes-h">
   <button class="handle-btn" id="handle" data-a="snap" aria-expanded="${S.snap!=='peek'}" aria-controls="routeList"><span class="handle"></span><span>${S.snap==='full'?ic('chev',16):ic('up',16)}${lab}</span></button>
   <div class="peek">${S.stop&&S.snap==='peek'?'':watchCard()}${nc&&S.snap==='peek'?`<button class="link" id="ncount" data-a="snapHalf">${ic('notice',16)} ${nc} Shuttle Notice${nc>1?'s':''} on ${S.campus==='All KSU'?'KSU':esc(S.campus)} routes</button>`:''}</div>
   <div class="sheet-body" id="routeList">${S.stop?stopDetail(S.stop,'a'):''}
    <div class="sheet-h"><h2 id="routes-h" tabindex="-1">${rs.length} routes</h2><span class="meta">${esc(NOW_LABEL)}</span></div>
    ${routeChips()}
    <ul class="rlist">${rs.map(routeRow).join('')}</ul></div>
   ${S.stop&&S.snap==='peek'?`<div class="peek">${stopDetail(S.stop,'p')}</div>`:''}</section>`;
}
/* ---- Layout B: departures board (stop-first) ---- */
function layB(){
  const ss=stopsShown().slice().sort((a,b)=>(a.id===S.watch?-1:b.id===S.watch?1:0)||a.name.localeCompare(b.name));
  return mapFrame()+`<section class="board" aria-labelledby="board-h"><div class="sheet-h"><h2 id="board-h" tabindex="-1">Departures · ${ss.length} stops</h2><span class="meta">${esc(NOW_LABEL)}</span></div>
   ${routeChips()}
   ${NOTICES.filter(n=>n.routes.some(c=>inCampus(byCode[c]))).map(n=>noticeEl(n,false)).join('')}
   <ul class="rlist">${ss.map(s=>{const rs=routesAt(s.id).filter(r=>!S.only||r.code===S.only);if(!rs.length)return '';const sel=S.stop===s.id;
     return `<li class="dep ${sel?'sel':''}" id="st-${s.id}"><div class="dep-h">${s.id===S.watch?ic('star',18):''}<button id="bx-${s.id}" data-a="stop" data-x="${s.id}" aria-expanded="${sel}"><b>${esc(s.name)}</b>${S.campus==='All KSU'?`<span class="meta">${s.campus}</span>`:''}</button>${(S.reports[s.id]||[]).filter(x=>x.ago<15).map(x=>`<span class="chip outline">${ic(x.k,14)}${REP[x.k][1]}</span>`).join('')}</div>
      <div class="deps">${rs.map(r=>{const a=arrivalText(r,s.id);return `<span class="depc ${a.sched?'sched':''}">${badge(r,true)}<span aria-hidden="true">${a.t}${a.sched?'':a.t==='Now'?'':' min'}</span><span class="sr">${esc(a.sr)}</span></span>`;}).join('')}</div>
      ${sel?stopDetail(s.id,'b'):''}</li>`;}).join('')}</ul></section>`;
}
/* ---- Layout C: route strip (route-first line diagram) ---- */
function layC(){
  const rs=routesShown();const r=byCode[S.route]&&inCampus(byCode[S.route])?byCode[S.route]:rs[0];S.route=r.code;
  return mapFrame()+`<section class="strip" aria-labelledby="strip-h"><div class="rpick" role="group" aria-label="Choose a route">${rs.map(x=>`<button id="rp-${x.code}" data-a="pickRoute" data-x="${x.code}" aria-pressed="${x===r}">${badge(x,true)}<span>${esc(x.name.split(' ')[0]==='KM'?'Intercampus':x.name.split(/ \/ | /)[0])}</span></button>`).join('')}</div>
   <div class="spread"><h2 id="strip-h" tabindex="-1" style="font-family:var(--font-display);font-size:var(--fs-xl)">${esc(r.name)}</h2>${badge(r)}</div>
   <p class="meta">${esc(r.hours)} · ${notRunning(r)?'not running today':live()?busesOn(r).length+' live':'positions not updating'} · ${DASHN[r.dash]} on the map</p>
   ${noticesFor(r.code).map(n=>noticeEl(n,true)).join('')}
   ${S.stop&&r.stops.includes(S.stop)?stopDetail(S.stop,'c'):''}
   ${stopLine(r,'c')}</section>`;
}
function dock(){return `<nav class="dock" aria-label="Primary">${DOCK.map(d=>d?`<a href="#" class="dock-i">${ic(d[2],22)}<span class="lbl">${d[1]}</span></a>`:`<button class="dock-q">${ic('owl',22)}<span class="lbl">Ask Scrappy</span></button>`).join('')}</nav>`;}
function render(opt={}){
  const app=$('#app');app.dataset.theme=S.theme;app.dataset.motion=S.motion;app.className='app'+(S.cvd?' cvd-'+S.cvd:'');
  $('#stage').dataset.frame=S.frame;document.documentElement.style.fontSize=S.text+'%';$('#textOut').textContent=S.text+'%';
  const fid=opt.focus||(document.activeElement&&document.activeElement.id&&$('#shellRoot').contains(document.activeElement)?'#'+document.activeElement.id:null);
  const sc=$('.sheet-body,.board,.strip')?.scrollTop;
  const body=S.layout==='board'?layB():S.layout==='strip'?layC():layA();
  $('#shellRoot').innerHTML=`<a class="skip" href="${listTarget()}">Skip to ${S.layout==='board'?'stop':'route'} list</a><div class="shell">${header()}
   <main class="main tr lay-${S.layout}" id="main"><h1 class="sr" id="main-h" tabindex="-1">Transit</h1>${body}</main></div>${dock()}`;
  $('#mapSlot').replaceWith(mapHost);
  if(sc!=null&&$('.sheet-body,.board,.strip'))$('.sheet-body,.board,.strip').scrollTop=sc;
  if(fid){const el=document.querySelector(fid);if(el)el.focus({preventScroll:!!opt.keepScroll});}
  if(map){requestAnimationFrame(()=>map.resize());syncMap();}
  renderNotes();
}

/* ===================== MAPLIBRE ===================== */
const css=v=>getComputedStyle($('#app')).getPropertyValue(v).trim();
const styleUrl=()=>`https://tiles.openfreemap.org/styles/${S.theme==='dark'?'dark':'positron'}`;
function canvasImg(w,h,draw,ratio=2){const c=document.createElement('canvas');c.width=w*ratio;c.height=h*ratio;const x=c.getContext('2d');x.scale(ratio,ratio);draw(x);return {width:c.width,height:c.height,data:x.getImageData(0,0,c.width,c.height).data};}
function images(){
  const surf=css('--surface'),ink=css('--ink'),mut=css('--muted'),out={};
  const busPath=(x,cx,cy)=>{x.beginPath();x.roundRect(cx-6,cy-7,12,12,2);x.moveTo(cx-6,cy-1);x.lineTo(cx+6,cy-1);x.stroke();x.beginPath();x.arc(cx-3,cy+6,1.4,0,7);x.arc(cx+3,cy+6,1.4,0,7);x.fill();};
  out['bus-live']=canvasImg(34,34,x=>{x.fillStyle=surf;x.beginPath();x.arc(17,17,13,0,7);x.fill();x.strokeStyle=ink;x.lineWidth=2.5;x.stroke();x.strokeStyle=ink;x.fillStyle=ink;x.lineWidth=1.8;busPath(x,17,16);});
  out['bus-stale']=canvasImg(34,34,x=>{x.globalAlpha=.85;x.fillStyle=surf;x.beginPath();x.arc(17,17,13,0,7);x.fill();x.strokeStyle=mut;x.lineWidth=2.2;x.setLineDash([3.5,2.5]);x.stroke();x.setLineDash([]);x.strokeStyle=mut;x.fillStyle=mut;x.lineWidth=1.8;busPath(x,17,16);});
  // heading wedge: drawn at the top of a 48px box so rotating the box points it
  out['heading']=canvasImg(48,48,x=>{x.fillStyle=ink;x.strokeStyle=surf;x.lineWidth=1.5;x.beginPath();x.moveTo(24,0.5);x.lineTo(31,10);x.lineTo(17,10);x.closePath();x.fill();x.stroke();});
  return out;
}
function routeGeo(){return {type:'FeatureCollection',features:routesShown().map(r=>({type:'Feature',geometry:{type:'LineString',coordinates:r.line},
  properties:{code:r.code,color:rcol(r),dash:r.dash,w:r.w||1,dim:(S.only&&S.only!==r.code)?1:0,sel:S.route===r.code?1:0,off:notRunning(r)?1:0}}))};}
function stopGeo(){return {type:'FeatureCollection',features:stopsShown().map(s=>{const rp=(S.reports[s.id]||[]).filter(x=>x.ago<15);
  return {type:'Feature',geometry:{type:'Point',coordinates:s.c},properties:{id:s.id,name:s.name+(rp.length?' · '+REP[rp[0].k][1].toLowerCase():''),sel:S.stop===s.id?1:0}};})};}
function busGeo(){if(S.feed==='offline')return {type:'FeatureCollection',features:[]};
  return {type:'FeatureCollection',features:BUSES.filter(b=>inCampus(byCode[b.route])&&(!S.only||S.only===b.route)).map(b=>{const r=byCode[b.route];const {p,hd}=pointAt(r,b.shown??b.s);
  return {type:'Feature',geometry:{type:'Point',coordinates:p},properties:{id:b.id,code:b.route,hd,stale:live()?0:1}};})};}
function addLayers(){
  for(const [k,v] of Object.entries(images())){if(map.hasImage(k))map.removeImage(k);map.addImage(k,v,{pixelRatio:2});}
  const ink=css('--ink'),focus=css('--focus'),surf=css('--surface');
  map.addSource('routes',{type:'geojson',data:routeGeo()});map.addSource('stops',{type:'geojson',data:stopGeo()});map.addSource('buses',{type:'geojson',data:busGeo()});
  const op=['case',['==',['get','dim'],1],.18,['==',['get','off'],1],.45,1];
  map.addLayer({id:'r-casing',type:'line',source:'routes',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':surf,'line-width':['*',['get','w'],9],'line-opacity':['case',['==',['get','dim'],1],.15,.95]}});
  map.addLayer({id:'r-sel',type:'line',source:'routes',filter:['==',['get','sel'],1],layout:{'line-join':'round'},paint:{'line-color':focus,'line-width':12,'line-opacity':.45}});
  for(const [d,arr] of [['solid',null],['dash',[2.2,1.4]],['dot',[0.6,1.1]]]){
    map.addLayer({id:'r-'+d,type:'line',source:'routes',filter:['==',['get','dash'],d],layout:{'line-join':'round','line-cap':d==='dot'?'round':'butt'},
      paint:{'line-color':['get','color'],'line-width':['*',['get','w'],d==='dot'?5:4.5],'line-opacity':op,...(arr?{'line-dasharray':arr}:{})}});}
  map.addLayer({id:'r-code',type:'symbol',source:'routes',minzoom:13.6,layout:{'symbol-placement':'line','symbol-spacing':220,'text-field':['get','code'],'text-font':['Noto Sans Bold'],'text-size':12*S.text/100,'text-keep-upright':true},
    paint:{'text-color':ink,'text-halo-color':surf,'text-halo-width':2.5,'text-opacity':['case',['==',['get','dim'],1],0,1]}});
  map.addLayer({id:'s-sel',type:'circle',source:'stops',filter:['==',['get','sel'],1],paint:{'circle-radius':13,'circle-color':'rgba(0,0,0,0)','circle-stroke-color':focus,'circle-stroke-width':4}});
  map.addLayer({id:'s-dot',type:'circle',source:'stops',paint:{'circle-radius':['interpolate',['linear'],['zoom'],12,3.5,16,7],'circle-color':surf,'circle-stroke-color':ink,'circle-stroke-width':2.5}});
  map.addLayer({id:'s-lbl',type:'symbol',source:'stops',minzoom:15.2,layout:{'text-field':['get','name'],'text-font':['Noto Sans Regular'],'text-size':12.5*S.text/100,'text-offset':[0,1.1],'text-anchor':'top','text-optional':true,'text-max-width':9},
    paint:{'text-color':ink,'text-halo-color':surf,'text-halo-width':2}});
  map.addLayer({id:'b-hd',type:'symbol',source:'buses',filter:['==',['get','stale'],0],layout:{'icon-image':'heading','icon-rotate':['get','hd'],'icon-rotation-alignment':'map','icon-allow-overlap':true,'icon-ignore-placement':true}});
  map.addLayer({id:'b-icon',type:'symbol',source:'buses',layout:{'icon-image':['case',['==',['get','stale'],1],'bus-stale','bus-live'],'icon-allow-overlap':true,'icon-ignore-placement':true,
    'text-field':['get','code'],'text-font':['Noto Sans Bold'],'text-size':12*S.text/100,'text-offset':[0,1.45],'text-anchor':'top','text-allow-overlap':true},
    paint:{'text-color':ink,'text-halo-color':surf,'text-halo-width':2.5}});
  map.on('click','s-dot',e=>{const f=e.features[0];if(f)selectStop(f.properties.id,'map');});
  map.on('click','b-icon',e=>{const f=e.features[0];if(f)selectBus(f.properties.id);});
  map.on('click',e=>{if(map.queryRenderedFeatures(e.point,{layers:['s-dot','b-icon']}).length)return;const f=map.queryRenderedFeatures([[e.point.x-8,e.point.y-8],[e.point.x+8,e.point.y+8]],{layers:['r-solid','r-dash','r-dot']})[0];if(f)selectRoute(f.properties.code);});
  for(const id of ['s-dot','b-icon','r-solid','r-dash','r-dot']){map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',id,()=>map.getCanvas().style.cursor='');}
}
function syncMap(){if(!map||!map.isStyleLoaded()||!map.getSource('routes'))return;map.getSource('routes').setData(routeGeo());map.getSource('stops').setData(stopGeo());map.getSource('buses').setData(busGeo());
  for(const [l,s] of [['r-code',12],['s-lbl',12.5],['b-icon',12]])if(map.getLayer(l))map.setLayoutProperty(l,'text-size',s*S.text/100);}
function initMap(){
  if(!window.maplibregl){mapHost.innerHTML='<p class="map-fallback">Map unavailable (offline or blocked). Every route and stop is in the list.</p>';return;}
  map=new maplibregl.Map({container:mapHost,style:styleUrl(),center:[-84.578,34.034],zoom:14,attributionControl:false,dragRotate:false,pitchWithRotate:false,touchPitch:false,maxZoom:18.5,minZoom:9.5});
  map.touchZoomRotate.disableRotation();map.keyboard.disableRotation();
  map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'Routes &amp; stops: Passio GO / Big Owl Bus'}),'bottom-right');
  map.on('style.load',addLayers);map.once('load',()=>fitCampus(true));
  map.getCanvas().setAttribute('aria-label','Shuttle map. Arrow keys pan, plus and minus zoom. Bus positions are not read out; the list has every route, stop and bus.');
}
const motionOpts=()=>reduced()?{duration:0}:{duration:500};
function sheetPad(){const r=mapHost.getBoundingClientRect(),sh=$('.lay-sheet .sheet');return sh&&r.width<1000?Math.min(sh.getBoundingClientRect().height,r.height*.6):24;}
function fitCampus(instant){if(!map)return;const rs=routesShown().filter(r=>!S.only||r.code===S.only).filter(r=>S.campus!=='Kennesaw'||r.code!=='KM'||S.only==='KM');
  const pts=rs.length?rs.flatMap(r=>r.line):routesShown()[0].line;
  const pts2=S.campus==='Kennesaw'&&S.only!=='KM'?pts.filter(p=>p[1]>34.0):S.campus==='Marietta'&&S.only!=='KM'?pts.filter(p=>p[1]<33.97):pts;
  let b=new maplibregl.LngLatBounds(pts2[0],pts2[0]);pts2.forEach(p=>b.extend(p));
  map.fitBounds(b,{padding:{top:56,left:24,right:64,bottom:sheetPad()+24},maxZoom:16.5,...(instant?{duration:0}:motionOpts())});}
function flyTo(c){if(!map)return;map.easeTo({center:c,zoom:Math.max(map.getZoom(),16),...motionOpts(),padding:{bottom:sheetPad(),top:0,left:0,right:0}});}
function say(m){const r=$('#live');r.textContent='';setTimeout(()=>r.textContent=m,30);}
function toast(msg,undo){const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(msg)}</span>${undo?`<button class="link" data-a="undoRep" data-x="${undo}">Undo</button>`:''}`;$('#toasts').append(t);setTimeout(()=>t.remove(),undo?6500:3600);}

/* ===================== SELECTION (list ↔ map parity) ===================== */
function stopSummary(id){const rs=routesAt(id);const first=rs.map(r=>({r,a:arrivalText(r,id)}))[0];return `${byStop[id].name} selected. ${rs.length} route${rs.length>1?'s':''}. ${first?first.a.sr:''}`;}
function selectStop(id,from){S.stop=id;if(S.layout==='sheet'&&S.snap==='peek'&&from==='map')S.snap='peek';
  if(S.layout==='strip'&&!byCode[S.route]?.stops.includes(id))S.route=routesAt(id)[0]?.code;
  const sc=S.layout==='board'?'b':S.layout==='strip'?'c':(S.snap==='peek'?'p':'a');render({focus:`#sd-h-${sc}`});
  $(`#sd-h-${sc}`)?.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});if(from==='map')say(stopSummary(id));}
function selectRoute(code){S.route=code;if(S.layout==='sheet'&&S.snap==='peek')S.snap='half';render({focus:S.layout==='strip'?'#rp-'+code:'#rx-'+code});
  $('#rt-'+code)?.scrollIntoView({block:'nearest'});const r=byCode[code];say(`${rName(r)} selected. ${DASHN[r.dash]}. ${noticesFor(code).length?noticesFor(code).length+' Shuttle Notice.':''}`);}
function selectBus(id){const b=BUSES.find(x=>x.id===id),r=byCode[b.route];const {p}=pointAt(r,b.s);
  let next=r.stopsOrdered.find(s=>r.sAt[s]>b.s)||r.stopsOrdered[0];
  S.route=r.code;if(S.layout==='sheet'&&S.snap==='peek')S.snap='half';render({focus:S.layout==='strip'?'#rp-'+r.code:'#rx-'+r.code});
  say(`${r.code} bus heading to ${byStop[next].name}. ${b.load}. ${live()?'Updated '+ago()+' seconds ago.':'Position not updating.'}`);}

/* ===================== LIVE SIMULATION (Passio every 12 s) ===================== */
let anim=null;
function tick(){
  if(S.feed!=='live')return;S.lastFetch=Date.now();
  BUSES.forEach(b=>{b.from=b.shown??b.s;b.s=(b.s+SPEED*12*S.speed)%byCode[b.route].L;});
  const prevEta=S.watch?routesAt(S.watch).map(r=>etaMin(r,S.watch)):[];
  if(anim)cancelAnimationFrame(anim);
  if(reduced()){BUSES.forEach(b=>b.shown=b.s);syncMap();}
  else{const t0=performance.now();const step=t=>{const f=Math.min(1,(t-t0)/900);BUSES.forEach(b=>{const L=byCode[b.route].L;let d=b.s-b.from;if(d<0)d+=L;b.shown=b.from+d*f;});
    if(map&&map.getSource('buses'))map.getSource('buses').setData(busGeo());if(f<1)anim=requestAnimationFrame(step);};anim=requestAnimationFrame(step);}
  render({keepScroll:true});
  // Announce policy under test: nothing for movement; one polite message when YOUR stop's next bus crosses ≤2 min, max 1/min.
  if(S.watch){const now=routesAt(S.watch).map(r=>({r,m:etaMin(r,S.watch)}));now.forEach((x,i)=>{if(x.m!=null&&x.m<=2&&(prevEta[i]==null||prevEta[i]>2)&&Date.now()-S.lastSay>60000){S.lastSay=Date.now();
    say(`${x.r.code} arriving at ${byStop[S.watch].name} in about ${Math.max(1,x.m)} minute${x.m>1?'s':''}.`);}});}
}
setInterval(()=>{const el=$('#agoTxt');if(el)el.textContent=ago();},1000);
let tickT=null;const restartTick=()=>{clearInterval(tickT);tickT=setInterval(tick,12000/Math.max(1,S.speed));};

/* ===================== ACTIONS ===================== */
const A={
 campus:(el,x)=>{S.campus=x;S.stop=null;S.only=null;if(S.route&&!inCampus(byCode[S.route]))S.route=null;
   if(!stopsShown().some(s=>s.id===S.watch))S.watch=(stopsShown()[0]||{}).id;render({focus:'#cmp-'+x.replace(' ','')});fitCampus();},
 zoom:(el,x)=>{if(!map)return;(+x>0?map.zoomIn:map.zoomOut).call(map,motionOpts());},
 recenter:()=>{fitCampus();say(`Map back to ${S.campus} routes`);},
 legend:()=>{S.legend=!S.legend;render({focus:'#legendBtn'});},
 snap:()=>{S.snap={peek:'half',half:'full',full:'peek'}[S.snap];render({focus:'#handle'});},
 snapHalf:()=>{S.snap='half';S.route=NOTICES[0].routes[0];render({focus:'#rx-'+S.route});},
 route:(el,x)=>{S.route=S.route===x?null:x;render({focus:'#rx-'+x});},
 pickRoute:(el,x)=>{S.route=x;S.stop=null;render({focus:'#rp-'+x});S.only=x;syncMap();fitCampus();S.only=null;syncMap();},
 only:(el,x)=>{S.only=x||null;render({focus:'#'+(el.id)});syncMap();fitCampus();say(x?`Map shows only ${rName(byCode[x])}`:'Map shows all routes');},
 stop:(el,x)=>{if(S.stop===x&&S.layout==='board'){S.stop=null;render({focus:'#bx-'+x});return;}selectStop(x,'list');flyTo(byStop[x].c);},
 closeStop:()=>{const id=S.stop;S.stop=null;render({focus:S.layout==='board'?'#bx-'+id:listTarget()});},
 showStop:(el,x)=>{if(S.layout==='sheet')S.snap='peek';if(S.layout==='board')S.mapOpen=true;render({focus:'#zin'});flyTo(byStop[x].c);say(`${byStop[x].name} shown on the map with a blue ring.`);},
 watch:(el,x)=>{S.watch=x;render({focus:'#'+el.id});toast(`${byStop[x].name} is your stop. It shows first on Transit and on Now.`);},
 pickWatch:()=>{S.snap='half';toast('Open any stop and tap “Make this your stop”.');render({focus:'#routes-h'});},
 report:(el,x)=>{const [id,k]=x.split(':');const rs=S.reports[id]=(S.reports[id]||[]).filter(r=>!r.mine);rs.unshift({k,ago:0,n:1,mine:true});S.mine={stop:id,k};
   toast(`Stop report posted at ${byStop[id].name}: ${REP[k][1]}. Shows for 15 min.`,id);render({focus:'#'+el.id});syncMap();},
 undoRep:(el,x)=>{S.reports[x]=(S.reports[x]||[]).filter(r=>!r.mine);S.mine=null;toast('Stop report removed.');render();syncMap();},
 mapToggle:()=>{S.mapOpen=!S.mapOpen;render({focus:'#mapToggle'});setTimeout(()=>map&&map.resize(),0);},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||!el.closest('#app'))return;if(el.tagName==='A')e.preventDefault();const f=A[el.dataset.a];if(f){e.preventDefault();f(el,el.dataset.x);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.legend){S.legend=false;render({focus:'#legendBtn'});}});

/* ===================== PROTOTYPE BAR ===================== */
const bind=(id,k,num,after)=>{const el=$(id);el.value=S[k];el.oninput=el.onchange=()=>{S[k]=num?+el.value:el.value;render();after&&after();};};
bind('#ctlLayout','layout',false,()=>{const u=new URL(location);u.searchParams.set('layout',S.layout);history.replaceState(null,'',u);setTimeout(()=>{map&&map.resize();fitCampus(true);},30);});
bind('#ctlTheme','theme',false,()=>{if(map)map.setStyle(styleUrl(),{diff:false});});
bind('#ctlMotion','motion');bind('#ctlText','text',true);bind('#ctlCvd','cvd');bind('#ctlFrame','frame',false,()=>setTimeout(()=>{map&&map.resize();fitCampus(true);},50));
bind('#ctlFeed','feed',false,()=>{syncMap();say(S.feed==='live'?'Live bus positions resumed.':S.feed==='stale'?'Bus positions are not updating. Times now show the schedule.':'Offline. Routes and stops only.');});
bind('#ctlSpeed','speed',true,restartTick);
$('#ctlNotes').onclick=()=>{S.notes=!S.notes;$('#notes').hidden=!S.notes;$('#ctlNotes').setAttribute('aria-expanded',S.notes);};
function renderNotes(){if(!S.notes&&$('#notes').innerHTML)return;
  const rows=ROUTES.map(r=>{const c=rcol(r),t=onCol(c),bg=S.theme==='dark'?'#211D17':'#FFFFFF',cr=ratio(c,t),lr=ratio(c,bg);
    return `<tr><td>${badge(r,true)}</td><td>${r.name}</td><td>${DASHN[r.dash]}</td><td><span class="sw" style="background:${c}"></span>${c}</td><td class="${cr>=4.5?'pass':'fail'}">${cr.toFixed(1)}:1</td><td class="${lr>=3?'pass':'info'}">${lr.toFixed(1)}:1${lr<3?' (casing)':''}</td></tr>`;}).join('');
  $('#notes').innerHTML=`<button class="x" onclick="$('#ctlNotes').click()">Close</button><h2>#67 Transit: what to react to</h2>
<ol>
<li><b>Layout</b>: <b>A</b> map + bottom sheet (Parking's winner): peek = “Your stop” next 3 arrivals; half/full = route list with each route's stop line. <b>B</b> Departures board: stop-first list of arrivals per stop, collapsible map card. <b>C</b> Route strip: pick one route, see a vertical line diagram of its stops with the buses placed between them. Desktop: map + 27rem side panel for all three.</li>
<li><b>Route identity</b>: code text first (on badges, along every line at zoom ≥13.6, under every bus), then line pattern (solid / dashed / dotted), then Okabe–Ito colour. KM keeps KSU gold and a thicker line. Badge text picks ink or white by contrast. Try Vision → greyscale.</li>
<li><b>Buses</b>: bus glyph in a ring + heading wedge + route code. Stale (no Passio update for 36 s = 3 polls, or feed down) = dashed faded ring, no wedge, and every time flips to “~N min · schedule” with a dashed dot. Bar → Feed.</li>
<li><b>Announcements</b>: bus movement is never announced. One polite message when <i>your stop's</i> next bus crosses ≤2 min, max once a minute, plus feed state changes. Map/bus taps announce what was selected. Bar → Speed 10× to hear it.</li>
<li><b>Reduced motion</b>: buses jump on each 12 s update (no glide); camera jumps. No pause toggle (#54: essential motion).</li>
<li><b>Stops</b>: tap a stop (map or list) → stop card: live/scheduled arrivals per route, Shuttle Notices for those routes, 3-tap stop report (No line / Long line / Passed full, 15 min, Undo), last-15-min reports, “Make this your stop”, “Show on map”. <b>No Clout</b> shown for stop reports (not in #52).</li>
<li><b>Shuttle Notice</b>: neutral card, grey double rule, notice icon, source line “Shuttle Notice · from Big Owl Bus via Passio GO · not a KSU safety Alert”. Never red, never a banner, never on /safety, only attached to its routes. Compare:<div class="alert-demo" style="margin-top:6px">OFFICIAL ALERT look (for contrast, /safety only): red border, red tint, “Official Alert · KSU Police”.</div></li>
<li><b>Shared CampusGeoMap</b>: same component as Parking (layers: lots | routes | stops | buses; mode live | static). Feed → offline shows the static commuter view: routes + stops + hours, no buses, no times.</li>
</ol>
<h2>Route colours (${S.theme})</h2><table><tr><td></td><td>Route</td><td>Pattern</td><td>Colour</td><td>Badge text</td><td>Line vs map bg</td></tr>${rows}</table>
<p class="info">Lines below 3:1 against the base map rely on the ${S.theme==='dark'?'dark':'white'} casing + pattern + code labels (1.4.11 graphical object = casing-outlined line).</p>`;}
$('#notes').hidden=true;
restartTick();render();initMap();

</script>
</body>
