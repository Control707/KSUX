<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · KSUX v2 · Moderator console</title>
<!--
  THROWAWAY PROTOTYPE. Branch prototype/v2-moderation, never merged.
  Ticket: "Prototype Moderator console for Incidents, reports and Appeals" (Map: KSUX v2, #35).
  Plan: three structurally different /moderation consoles, switchable via ?variant=A|B|C and the floating bar
  (← / → also cycle when focus is not in a field). ?frame=fluid shows the 1440 desktop layout.
    A  One queue + review page  - a single priority-ordered list; tapping an item opens a full review page
                                  (desktop: list left, review right). Actions in a sticky bar.
    B  Tabs + dense table       - Incidents / Photos / Posts & Listings tabs, each a table; rows expand inline.
    C  One case at a time       - the queue as a deck: one full case, decide or skip, then the next case.
  Shared and NOT varied (already decided in #51/#58): queue order identifies-me > held photo > other Incident
  reports > Posts/Listings, oldest first; ages shown, no review time; every action has a confirm alertdialog that
  states its effects and the log line it writes; notes from fixed templates only; Redaction is the only edit;
  suspend is maintainer-only; own items and CSA hide rules; Appeals (other Moderator) and Action log are their own
  sections, identical in every variant.
  Run: open this file in a browser. Everything is in memory; reload resets. All items are Demo fixtures.
-->
<style>
<style>
*,*::before,*::after{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:#26282d;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.stage{height:calc(100dvh - 64px);display:flex;align-items:center;justify-content:center;padding:12px}
.stage[data-frame="fluid"]{padding:0}
.stage[data-frame="fluid"] .app{width:100%;height:100%}
.stage[data-frame="phone"] .app{width:390px;height:min(844px,100%);border-radius:30px;box-shadow:0 0 0 10px #0d0e10,0 24px 60px rgba(0,0,0,.55)}

/* ================= TOKENS (Direction C) ================= */
.app{
  --fs-xs:.8125rem; --fs-sm:.875rem; --fs-body:1.0625rem; --fs-lg:1.125rem; --fs-xl:1.375rem; --fs-2xl:1.75rem; --fs-3xl:2.25rem;
  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem; --sp-5:1.5rem; --sp-6:2rem;
  --target:2.75rem; --r-sm:12px; --r-md:18px; --r-lg:24px; --r-card:28px; --r-pill:999px;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --font-display:ui-serif,"Iowan Old Style","Charter",Georgia,serif;
  --dur-1:120ms; --dur-2:320ms; --dur-fade:150ms; --ease:cubic-bezier(.2,.8,.2,1); --sheet-move:100%; --focus-w:3px;
  --bg:#FBF7EF; --surface:#FFFFFF; --surface-2:#F3ECDD; --ink:#1F1A14; --muted:#5C5245; --line:#E2D8C6; --line-strong:#8A7E6B;
  --accent:#FDBB30; --on-accent:#1F1A14; --accent-ink:#7A4E00; --accent-soft:#FBEBC4;
  --header:#FBF7EF; --demo:#FFB020; --focus:#0B57D0;
  --ok-fg:#14592F; --ok-bg:#DCF2E3; --warn-fg:#6B4700; --warn-bg:#FCEFD2; --bad-fg:#8F1D1D; --bad-bg:#FBE2E2;
  --ken-fg:#7A4E00; --ken-bg:#FBEBC4; --mar-fg:#1E3A8A; --mar-bg:#DBEAFE;
  --open-fg:#00517F; --open-bg:#E2F0F9; --filling-fg:#6B4700; --filling-bg:#FCEFD2; --nearly-fg:#8A2E00; --nearly-bg:#FBE1D3; --full-fg:#6E1F5C; --full-bg:#F6E1EE;
  --open-mark:#0072B2; --filling-mark:#B07A00; --nearly-mark:#D55E00; --full-mark:#A23B84;
  --shadow:0 2px 6px rgba(60,40,10,.06),0 12px 32px rgba(60,40,10,.08);
  --map-land:#EFE8D8; --map-road:#FFFFFF; --map-bldg:#D9CDB6;
}
.app[data-theme="dark"]{
  --bg:#17140F; --surface:#211D17; --surface-2:#2C271F; --ink:#F6EFE3; --muted:#BFB3A0; --line:#3A342A; --line-strong:#8C806C;
  --accent:#FDBB30; --on-accent:#1F1A14; --accent-ink:#FDCB5C; --accent-soft:#3A2F14;
  --header:#17140F; --focus:#8AB4F8;
  --ok-fg:#8FE0A9; --ok-bg:#12301C; --warn-fg:#F6C667; --warn-bg:#34270C; --bad-fg:#FFA8A8; --bad-bg:#3D1515;
  --ken-fg:#FDCB5C; --ken-bg:#3A2F14; --mar-fg:#A9C4FF; --mar-bg:#16234A;
  --open-fg:#8CCBF2; --open-bg:#0F2A3D; --filling-fg:#F6C667; --filling-bg:#34270C; --nearly-fg:#FFA27A; --nearly-bg:#3D1D0F; --full-fg:#F2A6D9; --full-bg:#3A1530;
  --open-mark:#56B4E9; --filling-mark:#E69F00; --nearly-mark:#FF7A33; --full-mark:#E07FC0;
  --shadow:0 1px 2px rgba(0,0,0,.4); --map-land:#252019; --map-road:#3A342A; --map-bldg:#3F372B;
}
.app[data-motion="reduce"]{--dur-1:0ms;--dur-2:0ms;--sheet-move:0%}
@media (prefers-reduced-motion:reduce){.app[data-motion="system"]{--dur-1:0ms;--dur-2:0ms;--sheet-move:0%}}

/* ================= BASE ================= */
.app{position:relative;overflow:hidden;container:app/inline-size;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-body);line-height:1.5;color-scheme:light}
.app[data-theme="dark"]{color-scheme:dark}
#shellRoot{height:100%}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.app :focus-visible{outline:var(--focus-w) solid var(--focus);outline-offset:2px}
.app [tabindex="-1"]:focus{outline:none}
h1,h2,h3,h4,p,figure{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.skip{position:absolute;left:var(--sp-2);top:-5rem;z-index:80;background:var(--ink);color:var(--bg);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-sm);font-weight:700}
.skip:focus{top:var(--sp-2)}
.muted{color:var(--muted)} .meta{font-size:var(--fs-xs);color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-display)}
svg.i{flex:none;display:block}
.stack{display:grid;gap:var(--sp-3);grid-template-columns:minmax(0,1fr)} .stack-lg{display:grid;gap:var(--sp-5);grid-template-columns:minmax(0,1fr)}
.app h1,.app h2,.app h3,.app p,.app b,.app a,.app span{overflow-wrap:anywhere;word-break:normal}
.row{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);flex-wrap:wrap}

/* buttons */
.btn{min-height:var(--target);padding:0 var(--sp-4);border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);text-decoration:none;font-size:var(--fs-sm);line-height:1.2;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad-fg);border-color:currentColor;background:transparent}
.btn.block{width:100%}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link{min-height:var(--target);display:inline-flex;align-items:center;gap:var(--sp-1);color:var(--accent-ink);font-weight:750;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;font-size:var(--fs-sm)}
.icon-btn{min-width:var(--target);min-height:var(--target);display:inline-grid;place-items:center;border:0;background:transparent;border-radius:var(--r-pill);cursor:pointer;color:var(--muted);padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.solid{background:var(--surface-2);color:var(--ink)}
.icon-btn[aria-pressed="true"]{color:var(--ink)}
.seg{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.seg button,.pill{min-height:var(--target);padding:0 var(--sp-4);border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:var(--fs-sm);cursor:pointer;display:inline-flex;align-items:center;gap:var(--sp-1);white-space:nowrap}
.seg button[aria-pressed="true"],.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hscroll{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;padding-bottom:var(--sp-1)}
.hscroll>*{flex:none}

/* chips & badges */
.chip{max-width:100%;display:inline-flex;align-items:center;gap:.3em;font-size:var(--fs-xs);font-weight:750;padding:.15rem .6rem .15rem .45rem;border-radius:var(--r-pill);white-space:nowrap;line-height:1.5;background:var(--surface-2);color:var(--ink)}
.chip.k{background:var(--ken-bg);color:var(--ken-fg)} .chip.m{background:var(--mar-bg);color:var(--mar-fg)}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg)} .chip.warn{background:var(--warn-bg);color:var(--warn-fg)} .chip.bad{background:var(--bad-bg);color:var(--bad-fg)}
.chip.open{color:var(--open-fg);background:var(--open-bg)} .chip.filling{color:var(--filling-fg);background:var(--filling-bg)} .chip.nearly{color:var(--nearly-fg);background:var(--nearly-bg)} .chip.full{color:var(--full-fg);background:var(--full-bg)}
.chip.outline{background:transparent;border:1.5px solid var(--line)}
a.chip{text-decoration:none;min-height:1.75rem}
.bar{height:.5rem;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.fill{display:block;height:100%;border-radius:inherit}
.fill.open{background:var(--open-mark)}
.fill.filling{background:repeating-linear-gradient(90deg,var(--filling-mark) 0 7px,transparent 7px 9px)}
.fill.nearly{background:repeating-linear-gradient(45deg,var(--nearly-mark) 0 5px,color-mix(in srgb,var(--nearly-mark) 45%,transparent) 5px 8px)}
.fill.full{background:repeating-linear-gradient(135deg,var(--full-mark) 0 3px,color-mix(in srgb,var(--full-mark) 60%,transparent) 3px 5px)}
.mark-open{color:var(--open-mark)} .mark-filling{color:var(--filling-mark)} .mark-nearly{color:var(--nearly-mark)} .mark-full{color:var(--full-mark)}
.count{min-width:1.35rem;height:1.35rem;padding:0 .35rem;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:800;display:inline-grid;place-items:center;line-height:1}
.avatar{flex:none;width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:var(--fs-sm);background:var(--surface-2);color:var(--ink);border:2px solid var(--line)}
.avatar.lg{width:5rem;height:5rem;font-size:var(--fs-xl)}
.avatar.owl{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* cards */
.card{background:var(--surface);border-radius:var(--r-card);padding:var(--sp-4);box-shadow:var(--shadow);display:grid;gap:var(--sp-2);min-width:0;grid-template-columns:minmax(0,1fr)}
.card.pad{padding:var(--sp-5)}
.card.flat{box-shadow:none;border:1.5px solid var(--line)}
.kicker{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink)}
.card h3,.story-h{font-family:var(--font-display);font-size:var(--fs-xl);line-height:1.2;font-weight:700}
.note{padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--surface-2);font-size:var(--fs-sm)}
.note.ok{background:var(--ok-bg);color:var(--ok-fg)} .note.warn{background:var(--warn-bg);color:var(--warn-fg)} .note.bad{background:var(--bad-bg);color:var(--bad-fg)}
.callout{border:2px solid var(--bad-fg);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sm);display:grid;gap:var(--sp-1)}
.callout b{color:var(--bad-fg)}
.list{list-style:none;margin:0;padding:0;display:grid}
.list>li{padding:var(--sp-3) 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.empty{text-align:center;padding:var(--sp-5);color:var(--muted);font-size:var(--fs-sm)}

/* forms */
.field{display:grid;gap:var(--sp-1)}
.field>label,.lbl{font-size:var(--fs-sm);font-weight:700}
.input,.select,.textarea{width:100%;min-height:var(--target);padding:var(--sp-2) var(--sp-3);border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font-size:var(--fs-body)}
.textarea{min-height:6rem;resize:vertical;line-height:1.45}
.select{appearance:none;padding-right:2.25rem;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 1.1rem) 50%,calc(100% - .75rem) 50%;background-size:.35rem .35rem;background-repeat:no-repeat}
.input:focus-visible,.select:focus-visible,.textarea:focus-visible{outline:var(--focus-w) solid var(--focus);outline-offset:1px}
.hint{font-size:var(--fs-xs);color:var(--muted)}
.err{font-size:var(--fs-sm);color:var(--bad-fg);font-weight:700}
.check{display:flex;gap:var(--sp-2);align-items:flex-start;min-height:var(--target);padding-top:var(--sp-2);font-size:var(--fs-sm);cursor:pointer}
.check input{width:1.4rem;height:1.4rem;margin:0;flex:none;accent-color:var(--ink)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:var(--fs-sm);font-weight:700;padding:0;margin-bottom:var(--sp-1)}
.radio-list{display:grid;gap:var(--sp-2)}
.radio{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3);border:1.5px solid var(--line);border-radius:var(--r-sm);cursor:pointer}
.radio:has(input:checked){border-color:var(--ink);background:var(--surface-2)}
.radio input{width:1.3rem;height:1.3rem;margin:.15rem 0 0;flex:none;accent-color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
@container app (max-width:22em){.grid2{grid-template-columns:1fr}}

/* photo picker + gallery */
.thumbs{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.thumb{position:relative;width:5rem;height:5rem;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .icon-btn{position:absolute;top:2px;right:2px;min-width:2.25rem;min-height:2.25rem;background:rgba(0,0,0,.65);color:#fff}
.add-photo{width:5rem;height:5rem;border:2px dashed var(--line-strong);border-radius:var(--r-sm);display:grid;place-items:center;align-content:center;gap:2px;font-size:var(--fs-xs);font-weight:750;cursor:pointer;color:var(--muted);text-align:center}
.add-photo:focus-within{outline:var(--focus-w) solid var(--focus);outline-offset:2px}
.add-photo input{position:absolute;opacity:0;width:1px;height:1px}
.media{display:grid;gap:var(--sp-2);grid-template-columns:repeat(2,minmax(0,1fr));border-radius:var(--r-md);overflow:hidden}
.media.one{grid-template-columns:1fr}
.media img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:var(--r-sm)}
.gallery{position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--surface-2)}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gallery .nav-g{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);color:#fff}
.gallery .prev{left:var(--sp-2)} .gallery .next{right:var(--sp-2)}
.gallery .pos{position:absolute;bottom:var(--sp-2);right:var(--sp-2);background:rgba(0,0,0,.7);color:#fff;font-size:var(--fs-xs);font-weight:800;padding:.1rem .6rem;border-radius:var(--r-pill)}
.gthumbs{display:flex;gap:var(--sp-2);margin-top:var(--sp-2)}
.gthumbs button{padding:0;border:3px solid transparent;border-radius:var(--r-sm);overflow:hidden;width:3.5rem;height:3.5rem;cursor:pointer;background:none}
.gthumbs button[aria-current="true"]{border-color:var(--ink)}
.gthumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* ================= SHELL ================= */
.shell{display:grid;height:100%;min-height:0;grid-template-rows:auto 1fr;grid-template-columns:100%;grid-template-areas:"header" "main"}
.hdr{grid-area:header;position:relative;z-index:6;background:color-mix(in srgb,var(--header) 94%,transparent);backdrop-filter:blur(10px);padding:var(--sp-2) var(--sp-4);border-bottom:1px solid transparent}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr-row{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--target)}
.brand{font-family:var(--font-display);font-weight:800;font-size:var(--fs-xl);font-style:italic;display:inline-flex;align-items:center;gap:var(--sp-2);text-decoration:none;color:var(--ink);min-height:var(--target)}
.brand .dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--accent)}
.hdr-title{font-weight:800;font-size:var(--fs-lg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .grow{flex:1}
.campus-chips{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;padding:var(--sp-2) 0 var(--sp-1)}
.campus-chips button{flex:none;min-height:var(--target);padding:0 var(--sp-4);border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:var(--fs-sm);cursor:pointer;display:inline-flex;align-items:center;gap:var(--sp-1)}
.campus-chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.campus-chips .lbl{align-self:center;flex:none;padding-right:var(--sp-1)}
.demo{position:relative}
.demo-pill{min-height:var(--target);display:inline-flex;align-items:center;gap:.3rem;padding:0 var(--sp-3);border-radius:var(--r-pill);background:transparent;color:var(--ink);border:2px solid var(--demo);font-weight:800;font-size:var(--fs-xs);cursor:pointer;white-space:nowrap}
.demo-pill .zap{color:var(--accent-ink)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:min(19rem,86vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2);box-shadow:0 12px 32px rgba(0,0,0,.25);max-height:70vh;overflow:auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:var(--sp-2) 0}
.menu-h{font-size:var(--fs-xs);font-weight:800;color:var(--muted);padding:var(--sp-1) var(--sp-2);text-transform:uppercase;letter-spacing:.06em}
.mi{display:flex;flex-direction:column;align-items:flex-start;width:100%;min-height:var(--target);padding:var(--sp-2);border:0;background:none;border-radius:var(--r-sm);cursor:pointer;text-align:left;font-size:var(--fs-sm);font-weight:700;color:var(--ink);text-decoration:none}
.mi:hover{background:var(--surface-2)}
.mi .muted{font-weight:500;font-size:var(--fs-xs)}
.mi[aria-checked="true"]::after{content:"✓ Active";font-size:var(--fs-xs);color:var(--accent-ink);font-weight:800}
.mi.danger{color:var(--bad-fg)}
.main{grid-area:main;overflow:auto;min-height:0;overscroll-behavior:contain;padding-bottom:7rem;scroll-padding-block:6rem 8rem}
.main.no-dock{padding-bottom:0}
.page{padding:var(--sp-3) var(--sp-4) var(--sp-5);display:grid;gap:var(--sp-5);max-width:46rem;margin:0 auto;grid-template-columns:minmax(0,1fr)}
.page-h h1{font-family:var(--font-display);font-size:var(--fs-2xl);line-height:1.15;font-weight:700}
.page-h p{color:var(--muted);font-size:var(--fs-sm);margin-top:var(--sp-1)}
.page-h .scope{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-xs);font-weight:700;color:var(--muted);margin-top:var(--sp-1)}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-2);flex-wrap:wrap}
.sec-row h2{font-family:var(--font-display);font-size:var(--fs-xl)}

/* dock (mobile bottom nav) */
.dock{position:absolute;left:var(--sp-3);right:var(--sp-3);bottom:max(var(--sp-3),env(safe-area-inset-bottom));z-index:7;display:grid;grid-template-columns:1fr 1fr 1.7fr 1fr 1fr;align-items:center;gap:var(--sp-1);padding:var(--sp-1);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);box-shadow:0 10px 30px rgba(40,25,5,.18)}
.dock-i{position:relative;min-height:3.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-size:.75rem;font-weight:700;border-radius:var(--r-pill);line-height:1.1}
.dock-i[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:850}
.dock-i .count{position:absolute;top:.1rem;left:calc(50% + .3rem)}
.dock-q{min-height:3.25rem;display:flex;align-items:center;justify-content:center;gap:var(--sp-1);border-radius:var(--r-pill);border:0;background:var(--accent);color:var(--on-accent);font-weight:850;font-size:var(--fs-sm);cursor:pointer;padding:0 var(--sp-2);line-height:1.1}
.rail,.pulse{display:none}
@container app (min-width:1024px){
  .shell{grid-template-columns:16rem minmax(0,1fr) 21rem;grid-template-areas:"rail header pulse" "rail main pulse"}
  .dock{display:none!important}
  .main{padding-bottom:var(--sp-6)}
  .rail{display:flex;flex-direction:column;grid-area:rail;min-height:0;overflow:auto;background:var(--bg);padding:var(--sp-4) var(--sp-3);gap:2px;border-right:1px solid var(--line)}
  .rail .brand{padding:0 var(--sp-3) var(--sp-3);font-size:var(--fs-2xl)}
  .rail a{display:flex;align-items:center;gap:var(--sp-3);min-height:var(--target);padding:0 var(--sp-4);border-radius:var(--r-pill);color:var(--muted);text-decoration:none;font-weight:700}
  .rail a[aria-current="page"]{background:var(--ink);color:var(--bg)}
  .rail a .count{margin-left:auto}
  .rail .rail-h{font-size:var(--fs-xs);font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:var(--sp-4) var(--sp-4) var(--sp-1)}
  .rail .btn{margin-top:var(--sp-4);min-height:3.25rem}
  .pulse{display:block;grid-area:pulse;overflow:auto;min-height:0;padding:var(--sp-4);border-left:1px solid var(--line);background:var(--surface)}
  .hdr .brand-m{display:none}
}
.pulse h2{font-family:var(--font-display);font-size:var(--fs-xl)}
.pulse h3{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:var(--sp-4) 0 var(--sp-1)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);padding:var(--sp-2) 0;border-bottom:1px solid var(--line)}

/* dialog / sheet primitive */
.backdrop{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);animation:fade var(--dur-fade) ease-out}
.dialog{grid-template-columns:minmax(0,1fr);position:absolute;z-index:41;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:var(--r-card) var(--r-card) 0 0;padding:var(--sp-3) var(--sp-5) var(--sp-6);animation:sheetIn var(--dur-2) var(--ease),fade var(--dur-fade) ease-out;display:grid;gap:var(--sp-4);align-content:start}
.dialog.full{top:0;max-height:none;border-radius:0}
@keyframes sheetIn{from{transform:translateY(var(--sheet-move))}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@container app (min-width:1024px){.dialog,.dialog.full{left:50%;right:auto;bottom:auto;top:8%;width:38rem;max-height:84%;transform:translateX(-50%);border-radius:var(--r-card);animation:fade var(--dur-fade) ease-out}}
.handle{width:2.5rem;height:.3rem;border-radius:var(--r-pill);background:var(--line);margin:0 auto}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.dlg-head h2{font-family:var(--font-display);font-size:var(--fs-xl);line-height:1.2}
.dlg-actions{display:flex;gap:var(--sp-2);justify-content:flex-end;flex-wrap:wrap}
.ask-field{display:flex;align-items:center;gap:var(--sp-2);min-height:3.5rem;padding:0 var(--sp-2) 0 var(--sp-4);border:2px solid var(--line-strong);border-radius:var(--r-pill);background:var(--bg)}
.ask-field input{flex:1;border:0;background:none;min-height:var(--target);font-size:var(--fs-body);min-width:0}
.ask-field input:focus{outline:none}
.ask-field:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.sec-h{font-size:var(--fs-xs);font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
.tiles button{display:grid;gap:var(--sp-1);text-align:left;min-height:5.5rem;padding:var(--sp-4);border-radius:var(--r-md);border:0;background:var(--surface-2);cursor:pointer;align-content:start;color:var(--ink)}
.tiles b{font-family:var(--font-display);font-size:var(--fs-lg)}
.tiles span{font-size:var(--fs-xs);color:var(--muted)}
.capchips{display:flex;flex-wrap:wrap;gap:var(--sp-2);list-style:none;margin:0;padding:0}
.capchips a{min-height:var(--target);display:inline-flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-4);border-radius:var(--r-pill);border:1.5px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;font-size:var(--fs-sm)}

/* toasts */
.toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:6.5rem;z-index:60;width:max-content;max-width:92%;display:grid;gap:var(--sp-2);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);font-weight:700;font-size:var(--fs-sm);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fade var(--dur-fade)}
.msg-toast{position:absolute;left:var(--sp-3);right:var(--sp-3);top:var(--sp-3);z-index:61;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);display:flex;align-items:center;gap:var(--sp-2);animation:fade var(--dur-fade)}
.msg-toast a{flex:1;text-decoration:none;font-size:var(--fs-sm);min-height:var(--target);display:grid;align-content:center}
@container app (min-width:1024px){.toasts{bottom:var(--sp-5)}.msg-toast{left:auto;width:24rem}}
.offline-bar{background:var(--warn-bg);color:var(--warn-fg);font-weight:750;font-size:var(--fs-sm);padding:var(--sp-2) var(--sp-4);display:flex;gap:var(--sp-2);align-items:center}

/* ================= SCREENS ================= */
/* Now */
.dateline{font-size:var(--fs-sm);color:var(--muted);font-weight:650}
.hello{font-family:var(--font-display);font-size:var(--fs-3xl);line-height:1.1;font-weight:700;letter-spacing:-.015em}
.lede blockquote{margin:0;font-family:var(--font-display);font-size:var(--fs-xl);line-height:1.35}
.lede blockquote::before{content:"“";color:var(--accent-ink);font-size:1.6em;line-height:0;vertical-align:-.35em;margin-right:.05em}
.src{font-size:var(--fs-xs);color:var(--muted);display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.carousel{display:flex;gap:var(--sp-3);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--sp-1) var(--sp-4) var(--sp-3);margin:0 calc(-1 * var(--sp-4));list-style:none;scroll-padding-inline:var(--sp-4);scrollbar-width:none}
.carousel:focus-visible{outline-offset:-3px}
.carousel>li{flex:0 0 min(15rem,78%);scroll-snap-align:start}
.carousel .card{height:100%}
.pct{font-family:var(--font-display);font-size:3rem;line-height:1;font-weight:700}
.deadlines{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.tonight{list-style:none;margin:0;padding:0}
.tonight li{display:grid;grid-template-columns:5rem minmax(0,1fr);gap:var(--sp-3);padding:var(--sp-3) 0;border-top:1px solid var(--line)}
.tonight .t{font-weight:800;font-size:var(--fs-sm)}
.tonight .link,.list .link{display:inline;min-height:0;line-height:1.6;padding-block:.6rem;}
@container app (max-width:22em){.tonight li{grid-template-columns:minmax(0,1fr)}}
.install{display:flex;gap:var(--sp-3);align-items:flex-start;position:relative}
.install>.icon-btn{position:absolute;top:var(--sp-2);right:var(--sp-2)}
.install>.stack{padding-right:var(--target)}

/* feed */
.rings{display:flex;gap:var(--sp-3);overflow-x:auto;scrollbar-width:none;padding:var(--sp-1) var(--sp-4) var(--sp-2);margin:0 calc(-1 * var(--sp-4));list-style:none}
.rings li{flex:none}
.ring{display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);border:0;background:none;cursor:pointer;padding:0;min-width:4rem;color:var(--ink);font-size:var(--fs-xs);font-weight:700;text-decoration:none}
.ring .r{width:3.5rem;height:3.5rem;border-radius:50%;display:grid;place-items:center;font-weight:850;font-size:.75rem;overflow-wrap:normal!important;line-height:1.1;text-align:center;border:3px solid var(--line);background:var(--surface)}
.ring[aria-pressed="true"] .r{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.ring.club .r{border-style:dashed}
.composer-start{flex-wrap:wrap;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-card);background:var(--surface);box-shadow:var(--shadow);border:0;width:100%;cursor:pointer;text-align:left;color:var(--muted);font-size:var(--fs-body);min-height:4rem}
.post{background:var(--surface);border-radius:var(--r-card);padding:var(--sp-4);box-shadow:var(--shadow);display:grid;gap:var(--sp-3);grid-template-columns:minmax(0,1fr)}
.post-h{display:flex;gap:var(--sp-3);align-items:flex-start}
.post-h .who{flex:1;min-width:0;display:grid;gap:2px}
.post-h .who a{font-weight:800;text-decoration:none}
.post-h .who a:hover{text-decoration:underline}
.post-body{white-space:pre-wrap;overflow-wrap:anywhere}
.post-body .tag{color:var(--accent-ink);font-weight:750}
.embed{display:grid;gap:2px;padding:var(--sp-3) var(--sp-4);border:1.5px solid var(--line);border-radius:var(--r-md);text-decoration:none}
.embed .t{font-weight:800}
.quote{border-left:4px solid var(--line-strong);padding:var(--sp-1) var(--sp-3);font-size:var(--fs-sm)}
.actions{display:flex;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:var(--sp-1);margin:0 calc(-1 * var(--sp-2))}
.act{min-height:var(--target);min-width:var(--target);display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);border:0;background:none;border-radius:var(--r-pill);cursor:pointer;color:var(--muted);font-weight:700;font-size:var(--fs-sm);padding:0 var(--sp-2)}
.act:hover{background:var(--surface-2);color:var(--ink)}
.act[aria-pressed="true"]{color:var(--ink)}
.cite{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:2rem;padding:0 var(--sp-3);border-radius:var(--r-pill);background:var(--accent-soft);color:var(--ink);font-size:var(--fs-xs);font-weight:750;text-decoration:none}
.reply{display:grid;gap:var(--sp-1);padding:var(--sp-3);border-radius:var(--r-md);background:var(--surface-2)}
.reply.owl{background:var(--accent-soft)}

/* marketplace */
.listings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
@container app (min-width:700px){.listings{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container app (max-width:20em){.listings{grid-template-columns:1fr}}
.listing{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.listing .ph{position:relative;aspect-ratio:1;background:var(--surface-2)}
.listing .ph img{width:100%;height:100%;object-fit:cover;display:block}
.listing .ph .n{position:absolute;bottom:var(--sp-2);left:var(--sp-2);background:rgba(0,0,0,.7);color:#fff;font-size:.75rem;font-weight:800;padding:.05rem .5rem;border-radius:var(--r-pill);display:inline-flex;gap:3px;align-items:center}
.listing .save{position:absolute;top:var(--sp-1);right:var(--sp-1);background:rgba(255,255,255,.92);color:#1F1A14;z-index:2}
.listing .save[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.listing .body{padding:var(--sp-3);display:grid;gap:2px;flex:1}
.listing .price{font-weight:900;font-size:var(--fs-lg)}
.listing .ttl{font-weight:700;font-size:var(--fs-sm);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.listing a.cover{position:absolute;inset:0;z-index:1;border-radius:var(--r-md)}
.listing a.cover:focus-visible{outline-offset:-3px}
.status-tag{position:absolute;top:var(--sp-2);left:var(--sp-2);z-index:2}

/* chats */
.chat-row{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-2) 0}
.chat-row a{flex:1;min-width:0;display:grid;gap:2px;text-decoration:none;min-height:3.5rem;align-content:center}
.chat-row .t{font-weight:800;display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.chat-row .p{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-row.unread .p{color:var(--ink);font-weight:650}
.thread{display:flex;flex-direction:column;height:100%;min-height:0}
.thread-scroll{flex:1;overflow:auto;padding:var(--sp-3) var(--sp-4);display:grid;gap:var(--sp-3);align-content:start}
.bubble-wrap{display:grid;gap:2px;max-width:85%}
.bubble-wrap.me{justify-self:end}
.bubble{padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);overflow-wrap:anywhere}
.me .bubble{background:var(--ink);color:var(--bg)}
.sys .bubble{background:var(--accent-soft);box-shadow:none;border:1.5px solid var(--accent)}
.bubble img{max-width:100%;border-radius:var(--r-sm);margin-top:var(--sp-1);display:block}
.bubble .rq{font-size:var(--fs-xs);border-left:3px solid currentColor;padding-left:var(--sp-2);opacity:.85;margin-bottom:var(--sp-1)}
.reacts{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.reacts button{min-height:2rem;padding:0 var(--sp-2);border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:var(--fs-xs);font-weight:750}
.reacts button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.msg-tools{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.composer-bar{border-top:1px solid var(--line);padding:var(--sp-2) var(--sp-3) max(var(--sp-3),env(safe-area-inset-bottom));display:grid;gap:var(--sp-2);background:var(--bg)}
.composer-bar form{display:flex;gap:var(--sp-2);align-items:flex-end}
.composer-bar .input{border-radius:var(--r-lg)}
.handoff{background:var(--surface);border-bottom:1px solid var(--line);padding:var(--sp-3) var(--sp-4);display:grid;gap:var(--sp-2)}
.handoff details summary{cursor:pointer;min-height:var(--target);display:flex;align-items:center;gap:var(--sp-2);font-weight:800;list-style:none}
.handoff details summary::-webkit-details-marker{display:none}

/* parking map */
.map{position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--map-land);border:1.5px solid var(--line)}
.map svg.mapsvg{display:block;width:100%;height:auto;transition:transform var(--dur-2) var(--ease);transform-origin:center}
.map .ctrls{position:absolute;right:var(--sp-2);top:var(--sp-2);display:grid;gap:2px;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);overflow:hidden}
.map .ctrls .icon-btn{border-radius:0;color:var(--ink)}
.map .attr{position:absolute;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 90%,transparent);font-size:.75rem;padding:2px var(--sp-2);border-top-left-radius:var(--r-sm)}
.map .legend{position:absolute;left:var(--sp-2);bottom:var(--sp-2);background:var(--surface);border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-2);font-size:.75rem;display:flex;gap:var(--sp-2);flex-wrap:wrap;max-width:70%}
.map .legend span{display:inline-flex;align-items:center;gap:2px;font-weight:700}
.lot{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:var(--sp-3) var(--sp-4);display:grid;gap:var(--sp-2);border:2px solid transparent}
.lot.sel{border-color:var(--ink)}
.lot-head{display:flex;gap:var(--sp-3);align-items:center}
.lot-head button.expand{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;display:grid;gap:2px;min-height:var(--target)}
.lot-head .nm{font-weight:800}
.slots{display:grid;grid-template-columns:repeat(28,1fr);gap:2px;margin-top:var(--sp-1)}
.slots span{height:1.1rem;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.slots span.f{background:var(--ok-fg);border-color:var(--ok-fg)}
.route-tile{flex:none;width:3rem;height:3rem;border-radius:var(--r-sm);display:grid;place-items:center;font-weight:900;font-size:var(--fs-sm);color:#1F1A14}
.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:var(--sp-2)}
.station{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm)}
.station ul{margin:var(--sp-1) 0 0;padding-left:1.1rem}
.tabs{display:flex;gap:var(--sp-1);border-bottom:1.5px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{min-height:var(--target);padding:0 var(--sp-3);border:0;background:none;font-weight:700;font-size:var(--fs-sm);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--ink);color:var(--ink)}
.profile-top{display:flex;gap:var(--sp-4);align-items:center}
.stats{display:flex;gap:var(--sp-5)}
.stats b{display:block;font-size:var(--fs-xl);font-family:var(--font-display)}

/* welcome */
.welcome{min-height:100%;display:grid;align-content:center;gap:var(--sp-5);padding:var(--sp-6) var(--sp-5);max-width:30rem;margin:0 auto}
.welcome h1{font-family:var(--font-display);font-size:var(--fs-3xl);line-height:1.1}
.otp{font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-2xl);letter-spacing:.4em;text-align:center}

/* LARGE TEXT MODE (>=150% text on a phone) */
@container app (max-width:18em){
  .demo-pill>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .dock{grid-template-columns:repeat(5,minmax(0,1fr))}
  .dock .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .dock-i,.dock-q{min-height:3.75rem}
  .listings{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .install{display:grid}
  .install>.stack{padding-right:0}
  .profile-top{flex-wrap:wrap}
  .stats{flex-wrap:wrap;gap:var(--sp-3)}
}

/* ================= PROTOTYPE CHROME (not under evaluation; px on purpose) ================= */
.proto-bar{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fff;color:#111;border-radius:999px;box-shadow:0 0 0 2px #ff2d92,0 10px 30px rgba(0,0,0,.45);font:600 12px/1 system-ui,sans-serif;white-space:nowrap;max-width:calc(100vw - 16px);overflow-x:auto}
.proto-bar button,.proto-bar select,.proto-bar a{font:inherit;height:32px;border:1px solid #ccc;border-radius:999px;background:#f4f4f4;padding:0 10px;cursor:pointer;color:#111;display:inline-flex;align-items:center;text-decoration:none}
.proto-bar .tag{background:#ff2d92;color:#fff;border-radius:999px;padding:4px 8px;font-weight:900;letter-spacing:.05em}
.proto-bar input[type=range]{width:80px}
.proto-bar label{display:flex;align-items:center;gap:4px}
.tokens{position:fixed;top:0;right:0;bottom:64px;width:min(440px,100vw);z-index:999;background:#fff;color:#111;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.4);font:13px/1.45 system-ui,sans-serif;padding:14px 16px 24px}
.tokens h2{font-size:15px;margin:16px 0 6px} .tokens table{width:100%;border-collapse:collapse;font-size:12px}
.tokens td{padding:4px;border-bottom:1px solid #eee;vertical-align:middle}
.tokens .sw{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2);vertical-align:-3px;margin-right:4px}
.tokens .pass{color:#0a6b2d;font-weight:800}.tokens .fail{color:#b00020;font-weight:800}.tokens .info{color:#555}
.tokens .x{float:right;height:32px;padding:0 12px;border-radius:999px;border:1px solid #ccc;background:#f4f4f4;cursor:pointer}
.tokens ul{padding-left:18px;margin:4px 0} .tokens code{background:#f1f1f1;padding:0 3px;border-radius:3px}


.cat-chip{display:inline-flex;align-items:center;gap:.4rem;font-size:var(--fs-xs);font-weight:800;padding:.15rem .65rem .15rem .4rem;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink)}
.prov{font-size:var(--fs-xs);color:var(--muted);font-weight:650;display:flex;flex-wrap:wrap;gap:.25rem .5rem}
.prov b{color:var(--ink);font-weight:800}

<script>
/* ================= ICONS ================= */
const P={

 bar:'<rect x="2" y="8" width="20" height="8"/>', ring:'<circle cx="12" cy="12" r="8" fill="none" stroke-width="3.5"/>',

/* ================= DATA ================= */
const CATS=[

];
/* ================= MODERATION DATA (all fixtures, "Demo · not real") ================= */
const M=60000, H=60*M, NOW=Date.now();
const cat=id=>CATS.find(c=>c.id===id); const area=id=>AREAS.find(a=>a.id===id);
const fmtT=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fmtD=t=>new Date(t).toLocaleDateString([], {month:'short',day:'numeric'});
const dur=ms=>{const m=Math.max(1,Math.round(ms/M));if(m<60)return`${m} min`;const h=Math.floor(m/60),r=m%60;return h<24?`${h} h${r?` ${r} min`:''}`:`${Math.floor(h/24)} d ${h%24} h`;};
const esc=s=>String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

const PERSONAS={
 judge:{h:'kaya.o',role:'Moderator',label:'You (judge) · Moderator'},

const REASON_LABEL={identifies_me:'This post identifies me',identifies_person:'Identifies a person',false_misleading:'False or misleading',campus_safety:'Campus Safety',spam:'Spam',harassment:'Harassment',other:'Something else'};

function seed(){
 const incidents=[
  {id:'I-3F2',cat:'theft',area:'lib',detail:'bike racks by the side entrance',seenAt:NOW-95*M,postedAt:NOW-88*M,author:'dev.r',hidden:true,status:'under_review',

  {id:'I-8A1',cat:'hazard',area:'epd',detail:'Level 3 ramp',seenAt:NOW-65*M,postedAt:NOW-60*M,author:'jules.m',hidden:false,status:'visible',

  {id:'I-9B4',cat:'closed',area:'grn',detail:'',seenAt:NOW-30*H,postedAt:NOW-30*H,author:'ana.l',hidden:false,status:'removed',

  {id:'I-7K0',cat:'damage',area:'cpd',detail:'Level 2',seenAt:NOW-3*H,postedAt:NOW-3*H,author:'kaya.o',hidden:false,status:'visible',

 ];
 const items=[

 ];
 const log=[

/* ================= STATE ================= */
const qs=new URLSearchParams(location.search);
const VARIANTS=[{k:'A',name:'One queue + review page'},{k:'B',name:'Tabs + dense table'},{k:'C',name:'One case at a time'}];

};
const me=()=>PERSONAS[S.persona];
const inc=id=>S.incidents.find(i=>i.id===id);
const $=s=>document.querySelector(s);
function announce(msg){S.lastAnnounce=msg;const l=$('#live');l.textContent='';setTimeout(()=>{l.textContent=msg;},30);}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').append(t);announce(msg);setTimeout(()=>t.remove(),4200);}
let focusSel=null; const focusAfter=s=>{focusSel=s;};
let lastTrigger=null;

/* ================= QUEUE LOGIC (the bit worth lifting) ================= */
const PRIO={claim:0,photo:1,report:2,post:3,listing:3};
const KIND_LABEL={claim:'"Identifies me" claim',photo:'Held photo',report:'Incident report',post:'Post report',listing:'Listing report'};
const isIncidentItem=it=>['claim','photo','report'].includes(it.kind);
function involvesMe(it){
 if(!isIncidentItem(it)) return false;
 const i=inc(it.target); return i.author===me().h || (it.reporters||[]).includes(me().h);
}
function visibleQueue(){
 // order: identifies-me → held photos → other Incident reports → Posts/Listings; oldest first inside each band
 const all=S.items.filter(it=>!(S.csa&&isIncidentItem(it)));
 const mine=all.filter(involvesMe);
 const q=all.filter(it=>!involvesMe(it)).sort((a,b)=>PRIO[a.kind]-PRIO[b.kind]||a.since-b.since);
 return {q,hiddenMine:mine.length,hiddenCsa:S.csa?S.items.filter(isIncidentItem).length:0};
}
function waitText(it){return `waiting ${dur(NOW-it.since)}`;}
function photoLeft(i){return dur(i.photo.heldAt+48*H-NOW);}
function itemTitle(it){
 if(isIncidentItem(it)){const i=inc(it.target);return `${area(i.area).name}`;}
 return it.targetLabel;
}
function itemReasonLine(it){
 if(it.kind==='photo') return `Photo on Incident ${it.target} · discarded in ${photoLeft(inc(it.target))} if not reviewed`;
 const parts=Object.entries(it.reasons).map(([r,n])=>`${REASON_LABEL[r]} (${n})`).join(', ');
 return parts;
}
function statusWord(i){return {visible:'Visible to Students',under_review:'Under review · hidden from Students',removed:'Removed',deleted:'Deleted by author'}[i.status];}
function availableActions(it){
 const role=me().role; const A=[];
 if(it.kind==='photo') return ['approvePhoto','approveBlur','rejectPhoto'].map(a=>({a,disabled:false}));
 if(isIncidentItem(it)){
  const i=inc(it.target);
  if(i.status==='under_review') A.push('restore'); else A.push('dismiss');
  A.push('redact','note','remove');
 } else A.push('dismiss','remove');
 A.push('suspend');
 return A.map(a=>({a,disabled:a==='suspend'&&role!=='Maintainer'}));
}
const ACT_LABEL={restore:'Restore',dismiss:'Dismiss reports',redact:'Redact text',note:'Add moderator note',remove:'Remove',suspend:'Suspend author',approvePhoto:'Approve photo',approveBlur:'Approve with blur',rejectPhoto:'Reject photo',upheld:'Uphold decision',reversed:'Reverse decision'};

/* what a confirm dialog says will happen, and the log entry it will write */
function effects(d){
 const it=S.items.find(x=>x.id===d.itemId); const i=it&&isIncidentItem(it)?inc(it.target):null; const ap=d.appealId&&S.appeals.find(a=>a.id===d.appealId);
 const who=i?`@${i.author}`:it?.targetLabel?.split(' by ')[1]||'';
 switch(d.action){
  case 'restore': return {h:'Restore this Incident?',list:['It shows to Students again.','Open reports on it are closed.',...(it.reasons?.false_misleading?['The note “Several Students reported this as inaccurate” is added and stays.']:[]),'The claimants get an in-app notice that it was restored. No push.'],tt:'restore'};
  case 'dismiss': return {h:'Dismiss these reports?',list:['Nothing changes on the content.','The reports are closed. Reporters are not told the outcome.'],tt:'dismiss'};
  case 'remove': return {h:i?'Remove this Incident?':'Remove this content?',list:['It is hidden from everyone at once.',`${who} gets an in-app notice with the reason you pick. No push.`,`${who} can send one Appeal. A different Moderator reviews it.`,'It is purged 30 days from now.'],tt:'remove',needsReason:true};
  case 'redact': return {h:'Redact part of the original?',list:['The words you choose are replaced with “[removed by moderators]”. Nothing else in the text changes.','The note “Identifying details removed” is added.','The original wording is kept only in the log snapshot, purged after 30 days.',`${who} gets an in-app notice. No push.`],tt:'redact',needsSpan:true};
  case 'note': return {h:'Add a moderator note?',list:['The note shows under the Incident, dated, with no Moderator name.','Only fixed wording can be used.'],tt:'note',needsTemplate:true};
  case 'suspend': return {h:`Suspend ${who}?`,list:['They can\'t sign in or post.','All their Incidents become Removed. Their Clout is reversed.','They can send one Appeal.'],tt:'suspend'};
  case 'approvePhoto': return {h:'Approve this photo?',list:['Students see the photo on the Incident.'],tt:'photo_approve'};
  case 'approveBlur': return {h:'Approve this photo blurred?',list:['Students see a blurred version only.'],tt:'photo_approve_blur'};
  case 'rejectPhoto': return {h:'Reject this photo?',list:['The photo is deleted now.','The note “Photo not approved” is added.',`${who} gets an in-app notice. No push.`],tt:'photo_reject'};
  case 'upheld': return {h:'Uphold the decision?',list:[`The Incident stays removed. @${ap.appellant} is told the decision was upheld.`,'This was their only Appeal for this decision.'],tt:'appeal_upheld'};
  case 'reversed': return {h:'Reverse the decision?',list:['The Incident shows to Students again.',`@${ap.appellant} is told it was restored.`],tt:'appeal_reversed'};
 }
}
function apply(d){
 const it=S.items.find(x=>x.id===d.itemId); const i=it&&isIncidentItem(it)?inc(it.target):null;
 const log=(action,extra={})=>{const e={id:'L'+(S.log.length+10),t:Date.now(),action,targetType:i?'incident':(it?.kind||'incident'),target:i?.id||it?.id||extra.target,actor:me().h,snapshot:!!i||!!extra.target,...extra};S.log.unshift(e);return e;};
 const notify=(h,msg)=>S.notices.push(`@${h}: ${msg}`);
 const done=()=>{S.items=S.items.filter(x=>x!==it);};
 switch(d.action){
  case 'restore': i.status='visible'; if(it.reasons?.false_misleading) i.updates.push({t:Date.now(),kind:'mod',text:NOTE_TEMPLATES[1].text}); log('restore'); (it.reporters||[]).forEach(r=>notify(r,'An Incident you reported was restored.')); done(); return 'Restored. Visible to Students again.';
  case 'dismiss': log('dismiss'); done(); return 'Reports dismissed.';
  case 'remove': {const r=REMOVE_REASONS.find(x=>x.id===d.reason).label; if(i) i.status='removed'; log('remove',{reason:r}); notify(i?.author||'author',`Removed: ${r}. You can appeal once.`); done(); return 'Removed. Author notified, Appeal available.';}
  case 'redact': i.text=i.text.replace(d.span,'[removed by moderators]'); i.updates.push({t:Date.now(),kind:'mod',text:NOTE_TEMPLATES[0].text}); if(i.status==='under_review') i.status='visible'; log('redact',{reason:'Identifying details removed'}); notify(i.author,'Part of your Incident was removed: identifying details.'); done(); return 'Redacted, note added, Incident visible again.';
  case 'note': {const tp=NOTE_TEMPLATES.find(x=>x.id===d.template); i.updates.push({t:Date.now(),kind:'mod',text:tp.text+(tp.needsLink?' '+ALERTS.find(a=>a.id===d.alert).label:'')+(tp.needsInc?' Incident '+d.dupe:'')}); log('note',{reason:tp.label}); return 'Note added. The item stays in the queue.';}
  case 'suspend': if(i){S.incidents.filter(x=>x.author===i.author).forEach(x=>x.status='removed');} log('suspend',{targetType:'account',target:'@'+(i?.author||'author')}); done(); return 'Account suspended.';
  case 'approvePhoto': case 'approveBlur': i.photo.approved=true; i.photo.blur=d.action==='approveBlur'; log(d.action==='approveBlur'?'photo_approve_blur':'photo_approve'); done(); return 'Photo approved.';
  case 'rejectPhoto': i.photo=null; i.updates.push({t:Date.now(),kind:'mod',text:NOTE_TEMPLATES[4].text}); log('photo_reject'); notify(i.author,'Your photo was not approved.'); done(); return 'Photo rejected and deleted.';
  case 'upheld': case 'reversed': {const ap=S.appeals.find(a=>a.id===d.appealId); ap.status=d.action; ap.reviewer=me().h; const t=inc(ap.target); if(d.action==='reversed') t.status='visible'; log('appeal_'+d.action,{targetType:'incident',target:ap.target}); notify(ap.appellant,d.action==='upheld'?'Your Appeal was reviewed: decision upheld.':'Your Appeal was reviewed: your Incident is restored.'); return d.action==='upheld'?'Appeal closed: decision upheld.':'Appeal closed: Incident restored.';}
 }
}

 if(e.needsTemplate) extra=`<fieldset class="field"><legend>Note</legend><div class="radio-list">${NOTE_TEMPLATES.filter(t=>t.id!=='photo_no'&&t.id!=='id_removed').map(t=>`<label class="radio"><input type="radio" name="nt" data-f="template" value="${t.id}" ${d.template===t.id?'checked':''}><span>${esc(t.label)}</span></label>`).join('')}</div></fieldset>
   ${d.template==='official'?`<div class="field"><label for="f-alert">Official notice to link</label><select class="select" id="f-alert" data-f="alert"><option value="">Choose an Official Alert</option>${ALERTS.map(a=>`<option value="${a.id}" ${d.alert===a.id?'selected':''}>${esc(a.label)}</option>`).join('')}</select><p class="hint">Only listed Official Alerts can be linked. The Incident stays a community report.</p></div>`:''}
   ${d.template==='duplicate'?`<div class="field"><label for="f-dupe">Other Incident</label><select class="select" id="f-dupe" data-f="dupe"><option value="">Choose</option>${S.incidents.filter(x=>x.id!==i.id&&x.status==='visible').map(x=>`<option value="${x.id}" ${d.dupe===x.id?'selected':''}>${x.id} · ${esc(area(x.area).name)}</option>`).join('')}</select></div>`:''}`;
 const ready=(!e.needsReason||d.reason)&&(!e.needsSpan||(d.span&&i.text.includes(d.span)))&&(!e.needsTemplate||(d.template&&(d.template!=='official'||d.alert)&&(d.template!=='duplicate'||d.dupe)));
 const target=i?`Incident ${i.id}`:d.appealId?`Appeal ${d.appealId}`:it?.targetLabel;
 return `<div class="backdrop" data-act="closeDialog"></div><div class="dialog stack" role="alertdialog" aria-modal="true" aria-labelledby="dlgH" aria-describedby="dlgD"><div class="handle"></div>
  <div class="dlg-head"><h2 id="dlgH" tabindex="-1">${esc(e.h)}</h2><button class="icon-btn" data-act="closeDialog" aria-label="Cancel">${ic('x')}</button></div>
  <div id="dlgD"><p class="meta">${esc(target)}</p><ul class="eff">${e.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  ${extra}
  <p class="logline">${ic('check',16)}<span>Logged as <b>${esc(e.tt.replace(/_/g,' '))}</b> · ${esc(target)} · by @${esc(me().h)} · ${fmtT(Date.now())}</span></p>
  <div class="dlg-actions"><button class="btn" data-act="closeDialog" id="dlgCancel">Cancel</button><button class="btn ${/remove|reject|suspend/i.test(d.action)?'danger solid-danger':'dark'}" data-act="confirm" ${ready?'':'aria-disabled="true"'}>${esc(ACT_LABEL[d.action])}</button></div>
  ${ready?'':`<p class="meta" role="note">${e.needsReason?'Pick a reason to continue.':e.needsSpan?'Choose words that are in the original.':'Pick a note'+(d.template==='official'?' and an Official Alert':d.template==='duplicate'?' and the other Incident':'')+' to continue.'}</p>`}
 </div>`;
}

/* ================= RENDER ================= */
function screen(){
 if(S.view==='appeals') return renderAppeals();
 if(S.view==='log') return renderLog();
 return S.variant==='A'?renderA():S.variant==='B'?renderB():renderC();
}
let lastOpenKey=null;
function render(){
 const app=$('#app'); app.dataset.theme=S.theme; app.dataset.motion=S.motion; $('#stage').dataset.frame=S.frame; document.documentElement.style.fontSize=S.text+'%';
 const mscroll=$('#main')?.scrollTop; const active=document.activeElement;
 const key=active?.id?'#'+active.id:active?.dataset?.act?`[data-act="${active.dataset.act}"]${active.dataset.id?`[data-id="${active.dataset.id}"]`:''}${active.dataset.a?`[data-a="${active.dataset.a}"]`:''}${active.dataset.v?`[data-v="${active.dataset.v}"]`:''}${active.dataset.t?`[data-t="${active.dataset.t}"]`:''}${active.dataset.p?`[data-p="${active.dataset.p}"]`:''}`:active?.dataset?.f?`[data-f="${active.dataset.f}"]${active.type==='radio'?`[value="${active.value}"]`:''}`:null;
 const sel=active?.selectionStart;
 $('#shellRoot').innerHTML=screen();
 $('#dialogRoot').innerHTML=renderDialog();
 const ok=S.dialog?'dlg:'+S.dialog.action+(S.dialog.itemId||S.dialog.appealId):null; if(ok&&ok===lastOpenKey) document.querySelectorAll('#dialogRoot .dialog,#dialogRoot .backdrop').forEach(n=>n.classList.add('settled')); lastOpenKey=ok;
 $('#shellRoot').inert=!!S.dialog;
 if($('#main')&&mscroll!=null&&!focusSel) $('#main').scrollTop=mscroll;
 if(focusSel){const el=$(focusSel); if(el){el.focus({preventScroll:false});} focusSel=null;}
 else if(key){const el=$(key); if(el){el.focus({preventScroll:true}); if(sel!=null&&el.setSelectionRange&&el.type==='text')try{el.setSelectionRange(sel,sel)}catch{}}}
 $('#vLabel').textContent=`${S.variant} · ${VARIANTS.find(v=>v.k===S.variant).name}`;
 if(S.state) renderState();
}
function renderState(){
 const v=visibleQueue();
 $('#statePanel').innerHTML=`<h2>Variant / viewer</h2><pre>${S.variant} · acting as @${me().h} (${me().role})${S.csa?' · CSA':''}</pre>
 <h2>Queue order (what this Moderator sees)</h2><pre>${esc(v.q.map((x,k)=>`${k+1}. [${PRIO[x.kind]}] ${x.kind} ${x.target||x.id} · ${dur(NOW-x.since)}`).join('\n')||'-')}\nhidden: ${v.hiddenMine} own · ${v.hiddenCsa} CSA</pre>
 <h2>Incidents</h2><pre>${esc(S.incidents.map(i=>`${i.id} ${i.status}${i.photo?` photo:${i.photo.approved?(i.photo.blur?'approved+blur':'approved'):'held'}`:''} updates:${i.updates.length}\n   “${i.text.slice(0,70)}…”`).join('\n'))}</pre>
 <h2>Action log (newest 6)</h2><pre>${esc(S.log.slice(0,6).map(l=>`${fmtT(l.t)} ${l.action} ${l.target} @${l.actor}`).join('\n'))}</pre>
 <h2>In-app notices sent (no push)</h2><pre>${esc(S.notices.join('\n')||'-')}</pre>
 <h2>Last screen-reader announcement</h2><pre>${esc(S.lastAnnounce||'-')}</pre>`;
}

/* ================= EVENTS ================= */
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act;
 if(el.tagName==='A') ev.preventDefault();
 if(el.getAttribute('aria-disabled')==='true'){ if(a==='ask') announce('Only maintainers can suspend accounts.'); else announce('Not ready yet. '+(document.querySelector('[role=note]')?.textContent||'')); return; }
 switch(a){
  case 'view': S.view=el.dataset.v; S.sel=null; S.menu=false; focusAfter('#pageH'); render(); announce(`${el.textContent.trim()}.`); break;
  case 'menu': S.menu=!S.menu; render(); break;
  case 'persona': S.persona=el.dataset.p; S.menu=false; S.sel=null; render(); toast(`Now acting as @${me().h} (${me().role}).`); break;
  case 'open': if(S.variant==='B'&&S.sel===el.dataset.id){S.sel=null;render();break;} S.sel=el.dataset.id; lastTrigger=el.dataset.id; focusAfter(S.variant==='B'?`#exp-${S.sel} .btn`:'#rh'); render(); break;
  case 'closeItem': S.sel=null; focusAfter(`[data-act="open"][data-id="${lastTrigger}"]`); render(); break;
  case 'tab': S.tab=el.dataset.t; S.sel=null; render(); break;
  case 'deck': S.deck+=+el.dataset.d; focusAfter('#rh'); render(); announce(`${$('#pos')?.textContent||''}`); break;
  case 'togglePhoto': S.showPhoto[el.dataset.id]=!S.showPhoto[el.dataset.id]; render(); announce(S.showPhoto[el.dataset.id]?'Photo shown.':'Photo hidden.'); break;
  case 'ask': lastTrigger=el.dataset.id; S.dialog={action:el.dataset.a,itemId:el.dataset.id}; focusAfter('#dlgCancel'); render(); break;
  case 'askAppeal': S.dialog={action:el.dataset.a,appealId:el.dataset.id}; focusAfter('#dlgCancel'); render(); break;
  case 'closeDialog': S.dialog=null; focusAfter(`[data-act="ask"][data-id="${lastTrigger}"]`); render(); announce('Cancelled. Nothing changed.'); break;
  case 'confirm': {
   const d=S.dialog; const before=visibleQueue().q; const idx=before.findIndex(x=>x.id===d.itemId);
   const msg=apply(d); S.dialog=null;
   const after=visibleQueue().q; const stillThere=after.some(x=>x.id===d.itemId);
   let next='';
   if(d.appealId){ focusAfter('#pageH'); }
   else if(stillThere){ focusAfter('#rh'); }
   else if(S.variant==='A'){ const nx=after[Math.min(idx,after.length-1)]; S.sel=(S.frame==='fluid'&&innerWidth>=1024&&nx)?nx.id:null; next=nx?` Next: ${KIND_LABEL[nx.kind]}, ${itemTitle(nx)}.`:' Queue is empty.'; focusAfter(S.sel?'#rh':nx?`[data-act="open"][data-id="${nx.id}"]`:'#pageH'); }
   else if(S.variant==='B'){ S.sel=null; focusAfter('[role=tab][aria-selected=true]'); }
   else { next=after.length?` Next case: ${KIND_LABEL[after[Math.min(S.deck,after.length-1)].kind]}.`:' Queue is empty.'; focusAfter(after.length?'#rh':'#pageH'); }
   render(); toast(msg+' Logged.'+next); break;}
 }
});
document.addEventListener('input',ev=>{const k=ev.target.dataset?.f; if(k==='span'&&S.dialog){S.dialog.span=ev.target.value;render();}});
document.addEventListener('change',ev=>{const k=ev.target.dataset?.f; if(!k||!S.dialog) return; if(k==='reason')S.dialog.reason=ev.target.value; if(k==='template'){S.dialog.template=ev.target.value;S.dialog.alert=null;S.dialog.dupe=null;} if(k==='alert')S.dialog.alert=ev.target.value; if(k==='dupe')S.dialog.dupe=ev.target.value; render();});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'){ if(S.dialog){S.dialog=null;focusAfter(`[data-act="ask"][data-id="${lastTrigger}"]`);render();announce('Cancelled. Nothing changed.');return;} if(S.menu){S.menu=false;render();return;} if(S.sel&&S.variant==='A'){S.sel=null;focusAfter(`[data-act="open"][data-id="${lastTrigger}"]`);render();return;} }
 if(ev.key==='Tab'&&S.dialog){const f=[...document.querySelectorAll('#dialogRoot button,#dialogRoot input,#dialogRoot select')];const first=f[0],last=f[f.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}
 const t=ev.target; if(ev.key!=='ArrowLeft'&&ev.key!=='ArrowRight') return;
 if(S.dialog||t.closest('input,textarea,select,[role=tablist],.radio-list')) return;
 cycle(ev.key==='ArrowRight'?1:-1);
});
function cycle(dir){const i=VARIANTS.findIndex(v=>v.k===S.variant);S.variant=VARIANTS[(i+dir+VARIANTS.length)%VARIANTS.length].k;const u=new URL(location.href);u.searchParams.set('variant',S.variant);history.replaceState(null,'',u);S.sel=null;S.deck=0;render();}
$('#vPrev').onclick=()=>cycle(-1); $('#vNext').onclick=()=>cycle(1);
$('#ctlTheme').onchange=e=>{S.theme=e.target.value;render();};
$('#ctlMotion').onchange=e=>{S.motion=e.target.value;render();};
$('#ctlText').oninput=e=>{S.text=+e.target.value;$('#textOut').textContent=S.text+'%';render();};
$('#ctlDemo').onchange=e=>{S.demo=e.target.checked;render();};
$('#ctlCsa').onchange=e=>{S.csa=e.target.checked;S.sel=null;render();announce(S.csa?'Viewing as a CSA Moderator: Incident items hidden.':'CSA view off.');};
$('#ctlFrame').value=S.frame; $('#ctlFrame').onchange=e=>{S.frame=e.target.value;S.sel=null;render();};
window.addEventListener('resize',()=>render());
$('#ctlState').onclick=e=>{S.state=!S.state;$('#statePanel').hidden=!S.state;e.target.setAttribute('aria-expanded',S.state);render();};
$('#ctlReset').onclick=()=>{Object.assign(S,seed(),{sel:null,deck:0,dialog:null,showPhoto:{},view:'queue'});render();};
render();
</script>
